    id: "m8-12", title: "Iskafya vs. is'hapcha", minutes: 5, intro: false,
    teach: `
<p><b>Two modes of avodah.</b></p>
<ul>
<li><b>Iskafya</b> (Aramaic: subduing): the animal soul still wants something, and you override it. You don't act on the desire. This is the beinoni's avodah.</li>
<li><b>Is'hapcha</b> (Aramaic: transformation): the desire itself is transformed. The animal soul now wants the good. This is the tzaddik's avodah: turning darkness itself into light.</li>
</ul>
<p><b>The power of iskafya.</b> Tanya ch. 27 quotes the Zohar: "When the sitra achra is subdued, the glory of Hashem rises in all the worlds." Every single act of self-restraint, even small, causes great <i>nachas ruach</i> (satisfaction) Above, like a king enjoying a victory. Tanya says this even applies to permitted things: holding back from a permitted pleasure for a moment, for Hashem's sake, is iskafya.</p>
<p><b>Small iskafya.</b> Examples chassidim practice:</p>
<ul>
<li>Waiting a few minutes before eating when hungry.</li>
<li>Not saying the clever cutting remark.</li>
<li>Not checking the phone right away.</li>
<li>Pausing before answering an angry customer.</li>
</ul>
<p>Each one is a victory.</p>
<p><b>Why this is good news.</b> You don't need to feel holy to do something holy. Every time you push back the animal soul, even while still wanting what it wants, that's a win with cosmic significance.</p>`,

    id: "m8-13", title: "Simcha", minutes: 5, intro: false,
    teach: `
<p><b>Why joy is essential.</b> Tanya ch. 26 says that to win the battle against the animal soul you need joy. The analogy: two people wrestling. If one is lazy and heavy, he'll lose, even if he's stronger. Sadness (<i>atzvus</i>) makes you sluggish and heavy. Joy makes you quick and strong.</p>
<p><b>Merirus vs. atzvus.</b> Tanya distinguishes between two feelings:</p>
<ul>
<li><b>Merirus</b> (bitterness): honest pain over a spiritual failing. It's active, it leads to change, and it's done at set times, like during a cheshbon hanefesh.</li>
<li><b>Atzvus</b> (sadness, depression): heavy and passive, leading nowhere. It comes from the animal soul, even when it looks religious.</li>
</ul>
<p>After the merirus, move to joy (Tanya ch. 31).</p>
<p><b>Sources of joy</b> (Tanya ch. 31 to 34):</p>
<ul>
<li>Your G-dly soul is part of Hashem.</li>
<li>Each mitzvah connects you to Him.</li>
<li>Hashem is truly everywhere. For a thinking person, that is itself deep joy (ch. 33).</li>
</ul>
<p><b>"Simcha poretz geder."</b> A well-known Chassidic saying: joy breaks through barriers. Obstacles that seem impossible when you're down can be broken through with joy.</p>
<p><b>For you.</b> You said: "No motivational filler." Tanya agrees. Simcha isn't hype. It's a disciplined state you build through thought, and it's what makes the discipline sustainable.</p>`,

    id: "m8-14", title: "Emunah and bitachon", minutes: 5, intro: false,
    teach: `
<p><b>Emunah</b> is belief: knowing that Hashem exists, runs the world, and is good. It's innate in every Jew; Chassidus calls it the soul's inheritance.</p>
<p><b>Bitachon</b> is trust: relying on Hashem in a specific situation, with calm confidence that it will be good. The classic source is <i>Chovos HaLevavos</i>, Shaar HaBitachon. The Rebbe explained (in sichos, drawing on the Tzemach Tzedek's "Tracht gut vet zain gut") that bitachon means trusting that Hashem will do good in a visible, understandable way, even if you don't feel you deserve it. That trust is itself what draws the good.</p>
<p><b>Bitachon and effort.</b> Chassidus teaches that a person must make an effort (<i>hishtadlus</i>), because Hashem's blessing comes through a "vessel". "Hashem your G-d will bless you in all that you do" (Devarim 15:18): you do, and He blesses. But the effort is a vessel, not the source. Excess effort driven by anxiety shows a lack of bitachon.</p>
<p><b>For your business.</b></p>
<ul>
<li>Do the work honestly and well.</li>
<li>Keep Shabbos even when it costs something.</li>
<li>Give maaser.</li>
<li>Then trust. Don't check the booking dashboard 30 times a day.</li>
</ul>
<p>The Gemara (Beitzah 16a) says a person's income is set on Rosh Hashanah, except for what he spends on Shabbos, Yom Tov, and Torah for his children, which is added back.</p>`,

    id: "m6-1", title: "How the calendar works", minutes: 5, intro: true,
    teach: `
<p><b>Lunar months, solar years.</b> Each month starts with the new moon (the <i>molad</i>). A lunar month is about 29.5 days, so months are 29 or 30 days, and 12 of them make about 354 days, roughly 11 days short of a solar year. But the Torah requires Pesach in the spring (Devarim 16:1). So a leap month (Adar I) is added <b>7 times in 19 years</b>: years 3, 6, 8, 11, 14, 17, and 19 of the cycle.</p>
<p><b>This year.</b> 5787 is year 11 of its cycle, so <b>it's a leap year</b>. There are two Adars, and Purim is in Adar II.</p>
<p><b>History.</b> Originally the Sanhedrin declared each month based on witnesses, and decided leap years. Around 359 CE, as persecution threatened the Sanhedrin, Hillel II fixed the calculated calendar we use today. That's why chutz la'aretz keeps Yom Tov Sheni (Module 0).</p>
<p><b>Postponements.</b> Rosh Hashanah never falls on Sunday, Wednesday, or Friday ("lo ADU Rosh"). Among other things, this prevents Yom Kippur from falling next to Shabbos, and Hoshana Rabbah from falling on Shabbos.</p>
<p><b>The months.</b> Nissan is the first month for counting festivals (Shemos 12:2), but the year number changes on Rosh Hashanah, 1 Tishrei. The months are Tishrei, Cheshvan, Kislev, Teves, Shvat, Adar, Nissan, Iyar, Sivan, Tammuz, Av, Elul.</p>
<p><b>Days start at night.</b> "And it was evening and it was morning" (Bereishis 1:5).</p>`,

  {
    id: "m6-2", title: "Rosh Chodesh", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> The first day of each month (or two days, when the previous month had 30 days: the 30th of the old month plus the 1st of the new). It's a minor festival.</p>
<p><b>Davening changes.</b></p>
<ul>
<li><b>Ya'aleh v'yavo</b> in the Amidah and in Birkas Hamazon.</li>
<li><b>Half Hallel</b> (some paragraphs are skipped).</li>
<li><b>A Torah reading</b> and <b>Musaf</b>.</li>
<li><b>No Tachanun.</b></li>
</ul>
<p>If you forget ya'aleh v'yavo at Shacharis or Mincha, you go back. At Maariv, you don't, since the month isn't sanctified at night (Shulchan Aruch 422:1).</p>
<p><b>Shabbos Mevarchim.</b> On the Shabbos before, the coming Rosh Chodesh is announced and blessed. Chabad says the whole Tehillim that morning (lesson m4-14).</p>
<p><b>Kiddush Levana.</b> The blessing on the renewing moon, said outside at night when the moon is visible, in the first half of the month after it has grown for some days. The Chabad custom is to say it on Motzei Shabbos when possible, in nice clothing, joyfully. Ask Zalmy for the exact window Chabad uses.</p>
<p><b>The idea.</b> The Jewish people are compared to the moon. It wanes and seems to disappear, then renews. Rosh Chodesh is a monthly reminder that renewal is always possible.</p>`,

    id: "m6-3", title: "Chanukah", minutes: 5, intro: false,
    teach: `
<p><b>The story.</b> In the 2nd century BCE, the Greek-Syrian rulers tried to force Hellenism on the Jews, outlawing Shabbos, bris milah, and Rosh Chodesh. The Chashmonaim (Maccabees) revolted and retook the Beis HaMikdash. They found only one sealed jar of pure oil, enough for one day. It lasted eight (Shabbos 21b).</p>
<p><b>The mitzvah.</b> Light the menorah each night, adding one light each night, with brachos. The first night also has Shehecheyanu. The shamash is set apart, and higher.</p>
<p><b>Chabad customs.</b></p>
<ul>
<li><b>Placement:</b> Chabad places the menorah in the doorway, opposite the mezuzah, so you are surrounded by mitzvos. <span class="diff">Difference: many place it in a window facing the street.</span></li>
<li><b>Lighting time:</b> the Chabad custom is around sunset. Check the Chabad luach.</li>
<li><b>Staying near:</b> you sit near the lights for the first half hour.</li>
<li><b>Who lights:</b> in yeshiva, bochurim generally light their own. Ask Zalmy about the Mayanot arrangement.</li>
</ul>
<p><b>Davening.</b> Al HaNissim in the Amidah and Birkas Hamazon, full Hallel all eight days, and no Tachanun.</p>
<p><b>Mivtza Chanukah.</b> The Rebbe launched public menorah lightings in the 1970s, to "publicize the miracle" (<i>pirsumei nisa</i>) in public squares. Today there are huge menorahs around the world, and Chabad bochurim do mivtzoyim with menorahs on the street.</p>
<p><b>The idea.</b> Add light each night: never be satisfied with yesterday's level. Beis Hillel's ruling, adding a light each night (Shabbos 21b), is a Chassidic motto for growth.</p>`,

    id: "m6-4", title: "Asarah B'Teves and the fast days", minutes: 5, intro: false,
    teach: `
<p><b>The four fasts</b> mentioned by the prophet Zechariah (8:19), connected to the destruction of the first Beis HaMikdash:</p>
<ul>
<li><b>10 Teves:</b> the siege of Yerushalayim by Nevuchadnezzar began.</li>
<li><b>17 Tammuz:</b> the walls were breached (for the second Temple). It begins the Three Weeks.</li>
<li><b>9 Av:</b> the destruction of both Batei Mikdash (lesson m6-10).</li>
<li><b>3 Tishrei (Tzom Gedaliah):</b> the assassination of Gedaliah, which ended Jewish self-rule after the first destruction.</li>
</ul>
<p>Also <b>Taanis Esther</b>, the day before Purim, which is a custom rather than an ancient fast.</p>
<p><b>The rules.</b> The minor fasts (all except 9 Av and Yom Kippur) run from dawn to nightfall; eating the night before is allowed. People who are ill, and pregnant or nursing women, are generally exempt; ask. There's an extra Torah reading and prayers (Aneinu, Selichos). A fast that falls on Shabbos is postponed (except Yom Kippur).</p>
<p><b>Asarah B'Teves is special.</b> Some Rishonim say that if it fell on Shabbos, it would be observed anyway, because the verse says "b'etzem hayom hazeh", "on this very day" (Yechezkel 24:2). It never falls on Shabbos in our calendar, but it can fall on Friday, and then we fast until nightfall Friday.</p>
<p><b>The Chassidic approach.</b> The Rebbe taught that a fast day is a day of goodwill (eis ratzon). Add tzedakah and Torah learning, and focus on the future: Zechariah prophesied that these fasts will become days of joy.</p>`,

    id: "m6-5", title: "Tu B'Shvat", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> "Rosh Hashanah for the trees" (Mishnah Rosh Hashanah 1:1). According to Beis Hillel it's the 15th of Shvat. It matters halachically for:</p>
<ul>
<li><b>Orlah:</b> counting a tree's years.</li>
<li><b>Maaser:</b> fruit that blossoms before and after Tu B'Shvat belongs to different years for tithing.</li>
</ul>
<p>In Israel, this is practical: produce's tithing year depends on it.</p>
<p><b>Customs.</b></p>
<ul>
<li>Eating fruits, especially fruits of Eretz Yisrael's seven species.</li>
<li>Saying Shehecheyanu on a new fruit.</li>
<li>No Tachanun.</li>
</ul>
<p>Choose fruits carefully and follow the order of precedence of brachos (lesson m3-6).</p>
<p><b>The Chassidic idea.</b> "A person is a tree of the field" (Devarim 20:19). The Rebbe often explained the parallels:</p>
<ul>
<li><b>Roots:</b> emunah, which you can't see but everything depends on.</li>
<li><b>Trunk and branches:</b> Torah and mitzvos.</li>
<li><b>Fruit:</b> the good you produce in others, which in turn has seeds for new trees.</li>
</ul>
<p>A tree's growth is slow and can't be rushed.</p>
<p><b>Timing.</b> Tu B'Shvat comes shortly after Yud Shvat. In Chabad the two are often felt together, a season of new growth.</p>`,

    id: "m6-6", title: "Purim", minutes: 5, intro: false,
    teach: `
<p><b>The story.</b> In Persia, Haman plotted to destroy all the Jews on 13 Adar. Through Esther and Mordechai, and a hidden chain of Divine providence, the decree was overturned. Hashem's name isn't mentioned in the Megillah, which teaches that He acts through hidden events.</p>
<p><b>Four mitzvos</b> (Esther 9:22; Shulchan Aruch 687 to 695):</p>
<ul>
<li><b>Megillah:</b> hear it twice, at night and in the day.</li>
<li><b>Mishloach manos:</b> at least two ready-to-eat foods to at least one person.</li>
<li><b>Matanos l'evyonim:</b> gifts to at least two poor people.</li>
<li><b>Seudah:</b> a festive meal in the daytime.</li>
</ul>
<p>Add Al HaNissim, and no Tachanun.</p>
<p><b>Jerusalem: Shushan Purim.</b> Walled cities from the time of Yehoshua keep Purim on the 15th, like Shushan. <b>Jerusalem keeps the 15th.</b> As a resident of Jerusalem this year, you keep Purim on 15 Adar (Adar II, since this is a leap year). The rules for visitors and travel are detailed; if you'll be elsewhere around Purim, ask Zalmy.</p>
<p><b>Chabad.</b></p>
<ul>
<li><b>Mivtza Purim:</b> bringing Megillah readings and mishloach manos to Jews everywhere.</li>
<li><b>Farbrengens:</b> drink within the Rebbe's guidelines, as with any farbrengen.</li>
</ul>
<p>Chassidus says Purim reveals a level beyond reason ("ad d'lo yada"), even higher than Yom Kippur (Yom haKippurim = "a day like Purim", in the Arizal's reading).</p>`,

    id: "m6-7", title: "Pesach, deeper", minutes: 5, intro: false,
    teach: `
<p><b>You know Pesach.</b> Here's what's specifically Chabad, and what applies in Israel.</p>
<p><b>Chametz.</b></p>
<ul>
<li><b>Bedikas chametz:</b> the search the night before Pesach. The Chabad custom is 10 pieces of bread, wrapped, searched for with a candle, a feather, and a wooden spoon.</li>
<li><b>Bittul:</b> nullifying any chametz you didn't find.</li>
<li><b>Mechiras chametz:</b> selling chametz through a rav.</li>
<li><b>Burning:</b> the chametz is burned the next morning.</li>
</ul>
<p><b>Chabad customs.</b></p>
<ul>
<li><b>No gebrokts.</b> Chabad doesn't eat matzah that has come into contact with water (no matzah balls, no matzah brei). Matzah is kept covered at the table, away from liquids, as a stringency against any trace of chametz. <span class="diff">Difference: many Ashkenazim and Sephardim do eat gebrokts.</span></li>
<li><b>Hand-baked shmurah matzah</b> for the seder, and many use it all Pesach.</li>
<li><b>The seder</b> follows the Alter Rebbe's Haggadah, and the ke'arah (seder plate) is arranged according to the Arizal.</li>
</ul>
<p><b>Moshiach's Seudah.</b> On the last day of Pesach, in the afternoon, a festive meal with matzah and four cups of wine. It was the Baal Shem Tov's custom; the Rebbe Rashab added the four cups in 1906. The Haftarah that day is about Moshiach (Yeshayahu 11).</p>
<p><b>In Israel.</b> Pesach is seven days, with one day of Yom Tov at each end. If you keep two days (Module 0), you'll have an extra day at each end, and a second seder. Ask Zalmy.</p>
<p><b>Pesach Sheni</b> (14 Iyar): a second chance. The Rebbe emphasized its lesson: it's never too late.</p>`,

  {
    id: "m6-8", title: "Sefiras HaOmer and Lag BaOmer", minutes: 5, intro: false,
    teach: `
<p><b>Counting.</b> "You shall count for yourselves... seven complete weeks" (Vayikra 23:15). From the second night of Pesach we count 49 days to Shavuos, each night after nightfall, with a bracha.</p>
<ul>
<li>If you forget at night, count during the day <b>without</b> a bracha, then continue with brachos.</li>
<li>If you missed an entire day, continue counting without a bracha for the rest (Shulchan Aruch 489:8).</li>
</ul>
<p>Chabad counts after Maariv.</p>
<p><b>Counting middos.</b> Following the Kabbalah, each of the seven weeks corresponds to one of the seven middos, and each day to a combination: day 1 is Chesed sheb'Chesed, and so on. Sefirah is a 49-day program of refining your character.</p>
<p><b>Mourning.</b> Rabbi Akiva's 24,000 students died in this period for not showing respect to each other (Yevamos 62b). Customs of mourning include no weddings and no haircuts.</p>
<ul>
<li><b>Chabad:</b> no haircuts through the whole Sefirah until Erev Shavuos, including Lag BaOmer, following the Arizal.</li>
<li><b>Weddings:</b> Chabad holds weddings from Lag BaOmer on.</li>
</ul>

    id: "m6-9", title: "Shavuos", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> 6 Sivan: the giving of the Torah at Sinai (Matan Torah). It has no fixed date in the Torah; it's the day after counting 49 days. In Israel it's one day; in chutz la'aretz, two.</p>
<p><b>Customs.</b></p>
<ul>
<li><b>Staying up the night learning.</b> The <i>Tikkun Leil Shavuos</i> is the text Chabad says. The reason given: to rectify the Jews' having overslept on the morning of Matan Torah.</li>
<li><b>Dairy foods.</b></li>
<li><b>Reading Megillas Rus.</b></li>
<li><b>Everyone hearing the Aseres HaDibros.</b> The Rebbe especially emphasized bringing children, even babies, to shul to hear the Ten Commandments, as at Sinai.</li>
</ul>
<p><b>The Baal Shem Tov.</b> He passed away on Shavuos, 1760. It's also traditionally the yahrzeit of King Dovid.</p>
<p><b>The idea.</b> At Sinai, the Midrash says, the separation between "upper" and "lower" worlds was broken. Hashem came down, and people could reach up. From then on, physical things used for mitzvos become holy. That's the start of dirah b'tachtonim. That's why Shavuos is also celebrated physically, with food and joy.</p>
<p><b>Preparation.</b> The three days before Shavuos are the <i>Shloshes Yemei Hagbalah</i>, days of preparation, parallel to the three days of preparation at Sinai.</p>`,

    id: "m6-10", title: "The Three Weeks and Tishah B'Av", minutes: 5, intro: false,
    teach: `
<p><b>The Three Weeks.</b> From 17 Tammuz (the walls breached) to 9 Av (both Batei Mikdash destroyed). Mourning customs increase over the period.</p>
<ul>
<li><b>Throughout:</b> no weddings, no haircuts, no music.</li>
<li><b>From Rosh Chodesh Av, the Nine Days:</b> no meat or wine (except on Shabbos and at a seudas mitzvah), no laundry, no new clothes.</li>
</ul>
<p><b>Chabad emphasis.</b> The Rebbe encouraged:</p>
<ul>
<li><b>Learning the laws of the Beis HaMikdash</b> during the Three Weeks: Hilchos Beis HaBechirah in the Rambam, and tractate Middos. Learning about it is in some sense like building it.</li>
<li><b>Siyumim</b> (completing a tractate) each day of the Nine Days. They bring joy, and the meat meal of a siyum.</li>
<li><b>Extra tzedakah.</b></li>
</ul>
<p><b>Tishah B'Av.</b> A full fast of about 25 hours, from sunset to nightfall. There's no eating, drinking, washing, leather shoes, or marital relations, and learning is limited to sad topics. Eichah and Kinos are read, sitting on the floor. Tallis and tefillin are worn at Mincha, not Shacharis.</p>
<p><b>Why it happened.</b> The second Beis HaMikdash was destroyed because of baseless hatred (<i>sinas chinam</i>), Yoma 9b. The Rebbe, quoting earlier sources, taught: the fix is baseless love, <i>ahavas chinam</i>.</p>
<p><b>After.</b> Tu B'Av (15 Av) is a day of joy, and the seven weeks of consolation lead into Rosh Hashanah.</p>`,

    id: "m6-11", title: "Elul", minutes: 5, intro: false,
    teach: `
<p><b>The month of preparation.</b> Elul is the month before Rosh Hashanah, dedicated to teshuvah and reflection. The name is read as an acronym of "Ani l'dodi v'dodi li" (Shir HaShirim 6:3), "I am my Beloved's and my Beloved is mine".</p>
<p><b>The king in the field.</b> The Alter Rebbe's famous parable (Likkutei Torah, Re'eh): during the year, the king sits in his palace, and approaching him takes appointments and ceremony. In Elul the king comes out to the field. Anyone can approach him, and he receives everyone with a smile. Elul is when Hashem is most accessible.</p>
<p><b>Customs.</b></p>
<ul>
<li><b>Shofar</b> is blown each weekday after Shacharis, from Rosh Chodesh Elul.</li>
<li><b>Tehillim 27</b> ("L'Dovid Hashem ori") is added twice daily.</li>
<li><b>Chabad (the Baal Shem Tov's custom):</b> saying three extra chapters of Tehillim every day from Rosh Chodesh Elul until Yom Kippur. On Yom Kippur, the remaining 36 chapters complete the book.</li>
<li><b>Checking tefillin and mezuzos.</b></li>
<li><b>Letters and greetings:</b> "Kesiva v'chasima tova".</li>
</ul>
<p><b>Chai Elul</b> (lesson m7-9) marks the final 12 days.</p>
<p><b>The idea.</b> Elul isn't gloomy. It's the most personal, accessible month. You're in yeshiva for this coming Elul (5787), which is a great opportunity.</p>`,

    id: "m6-12", title: "Rosh Hashanah and Yom Kippur", minutes: 5, intro: false,
    teach: `
<p><b>Rosh Hashanah.</b> The day Adam was created, and the anniversary of the world's purpose. Chassidus explains that the core of the day is the coronation of Hashem as King: we "rebuild" His desire for the world (Likkutei Torah on Rosh Hashanah).</p>
<ul>
<li><b>The shofar</b> is the coronation trumpet and the soul's simple cry.</li>
<li><b>100 blasts</b> are sounded.</li>
<li><b>Simanim:</b> symbolic foods like apple in honey.</li>
<li><b>Tashlich:</b> at a body of water. Chabad says it on the first day, unless it's Shabbos.</li>
</ul>
<p>Chabad custom is to spend the day in prayer and Tehillim, avoiding idle talk and daytime napping.</p>
<p><b>The Ten Days of Teshuvah.</b> A time of extra care: for example, pas Yisrael for everyone (lesson m5-3).</p>
<p><b>Erev Yom Kippur.</b></p>
<ul>
<li><b>Kapparos:</b> Chabad does it with chickens.</li>
<li><b>Lekach:</b> asking for and receiving honey cake. The Rebbe used to give it out, as a symbol of receiving a sweet year from a person rather than needing to ask Heaven.</li>
<li><b>Two festive meals.</b></li>
<li><b>Asking forgiveness</b> from people you've wronged. Yom Kippur doesn't atone for sins between people until you've appeased them (Yoma 85b).</li>
</ul>
<p><b>Yom Kippur.</b> Five afflictions: no eating or drinking, washing, anointing, leather shoes, or marital relations. Five prayers, ending with Neilah. It's a day of atonement from Hashem Himself. The essence of the day atones (Yoma 85b), with teshuvah.</p>
<p><b>Chabad after Neilah.</b> The shofar, "L'shanah haba'ah b'Yerushalayim", and then chassidim sing the joyous <b>"Napoleon's March"</b>, a niggun associated with the Alter Rebbe, as a triumphant close.</p>`,

    id: "m11-1", title: "What a farbrengen is", minutes: 5, intro: true,
    teach: `
<p><b>The word.</b> "Farbrengen" is Yiddish for "spending time together". In Hebrew it's <i>hisvaadus</i>. It's a Chassidic gathering where people sit around a table, usually with a mashpia or an older chassid leading.</p>
<p><b>What happens.</b></p>
<ul>
<li><b>Words of Torah and Chassidus</b> (a vort, a sicha, or a maamar), explained and applied.</li>
<li><b>Stories</b> of Rebbeim and chassidim.</li>
<li><b>Niggunim:</b> singing together, often long and slow, then lively.</li>
<li><b>L'chaim:</b> a little mashke (drink), to open up.</li>
<li><b>Honest talk about avodah:</b> people's real struggles, sometimes a friendly rebuke.</li>
<li><b>Hachlatos:</b> practical resolutions to take home.</li>
</ul>
<p><b>Why it's powerful.</b> A famous Chassidic saying, attributed to the Alter Rebbe and quoted by the Frierdiker Rebbe: <i>"What a Chassidic farbrengen can accomplish, even the angel Michoel cannot."</i> The reason: an angel's blessing comes from Above, while a farbrengen is Jews helping each other, out of love, to change. That's a father's joy when his children help each other.</p>
<p><b>When.</b></p>
<ul>
<li>Shabbos afternoons, especially Shabbos Mevarchim.</li>
<li>Chabad dates (Module 7).</li>
<li>Yeshiva events.</li>
<li>Informally: a few friends and a bottle.</li>
</ul>
<p><b>The measure of a good farbrengen</b> isn't how inspired you felt. It's whether something changed on Sunday.</p>`,

    id: "m11-2", title: "Farbrengen etiquette", minutes: 5, intro: true,
    teach: `
<p><b>Sitting down.</b></p>
<ul>
<li>Sit at the table, not off to the side. Participate.</li>
<li>The mashpia or leader usually sits at the head. Don't take his seat.</li>
<li>Phones away.</li>
</ul>
<p><b>L'chaim.</b> When someone says "l'chaim" to you, answer "l'chaim v'livracha" (to life and to blessing). Customarily you say l'chaim when you drink, and people may give you a bracha.</p>
<p><b>Listening.</b></p>
<ul>
<li>Don't interrupt the speaker.</li>
<li>When a niggun starts, join in, even if you don't know the words or tune well. Hum.</li>
<li>Don't leave in the middle of a story or a sicha.</li>
</ul>
<p><b>Rebuke.</b> At a farbrengen, a mashpia may say something direct, sometimes uncomfortable. It's done out of love, and you're expected to hear it without getting defensive. What's said at a farbrengen, especially about individuals, stays there.</p>
<p><b>Speaking up.</b> You're allowed to ask questions and share. Keep it real, not showy. Chassidim can tell.</p>
<p><b>Hachlatos.</b> Toward the end, people often make resolutions, sometimes out loud. Make one that's small, specific, and real.</p>
<p><b>Leaving.</b> If you need to go, do it quietly, ideally between parts, and wish people l'chaim.</p>`,

    id: "m11-3", title: "The mashpia", minutes: 5, intro: false,
    teach: `
<p><b>What a mashpia is.</b> A spiritual mentor: someone who guides your avodah, meaning your davening, middos, growth, and life decisions from a Chassidic perspective. From the root <i>shefa</i>, flow: someone who "influences" or channels.</p>
<p><b>Mashpia vs. rav.</b></p>
<ul>
<li><b>A rav</b> gives halachic rulings: what's permitted and forbidden.</li>
<li><b>A mashpia</b> guides your inner life: how to grow, what to work on, how to handle challenges.</li>
</ul>
<p>Sometimes they're the same person, but the roles are different.</p>
<p><b>"Aseh lecha rav."</b> The Mishnah (Avos 1:6) says "make for yourself a rav, and acquire for yourself a friend". The Rebbe repeatedly urged every person, including rabbis and adults, to have a mashpia or "rav" for guidance. No one should rely only on their own judgment in spiritual matters, because everyone is biased about himself.</p>
<p><b>Choosing one.</b></p>
<ul>
<li>Someone you respect and can talk to openly.</li>
<li>Someone who knows you.</li>
<li>Someone you'll actually listen to, even when you don't like the answer.</li>
</ul>
<p>At Mayanot, Zalmy and the yeshiva's mashpiim are natural choices. Back home, it might be the Chabad shliach.</p>
<p><b>How to use one.</b> Regular conversations, not just in a crisis. Bring real questions: davening, business ethics, friendships, dating eventually. Be honest.</p>`,

    id: "m11-4", title: "L'chaim culture", minutes: 5, intro: false,
    teach: `
<p><b>Why drink at all?</b> A little mashke at a farbrengen helps open up. The Gemara says "when wine goes in, the secret comes out" (Eruvin 65a). Chassidim use this to get past the ego's defenses and speak honestly about avodah. It's a tool, not the point.</p>
<p><b>The Rebbe's directive.</b> The Rebbe gave a clear instruction: <b>those under 40 should drink no more than four small cups (a small shot glass each) at a farbrengen.</b> He was concerned about excess, and about drinking replacing real avodah. Many chassidim drink less, or nothing. You're 18, so this applies fully.</p>
<p><b>Practical rules.</b></p>
<ul>
<li><b>Never pressure anyone</b> to drink, and don't accept pressure. "I'm at my limit" is respected by serious chassidim.</li>
<li><b>Never drive</b> after drinking. Obvious, but it needs saying.</li>
<li><b>Legal age:</b> in Israel it's 18. In the US it's 21.</li>
<li><b>Purim:</b> "ad d'lo yada" is not a license for danger. Stay within safe limits.</li>
</ul>
<p><b>The real "l'chaim".</b> Saying l'chaim is a wish for life. The Rebbe often gave a bracha with it. Some chassidim say l'chaim over water or juice: the wish, the connection, and the bracha are what matter.</p>
<p><b>Honest check.</b> If you find the drinking is the part you look forward to most, talk to your mashpia.</p>`,

    id: "m11-5", title: "Mivtzoyim", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> "Mivtzoyim" means campaigns: going out to help other Jews do a mitzvah. The most famous is <b>Mivtza Tefillin</b>, started by the Rebbe in 1967 before the Six Day War.</p>
<p><b>Why one mitzvah matters.</b> The Rebbe taught that every single mitzvah connects a Jew to Hashem eternally, regardless of the rest of his observance. The Rambam writes that a person should see the world as balanced, so that his next act could tip it to merit (Hilchos Teshuvah 3:4). One tefillin put on can be that act.</p>
<p><b>How it works.</b></p>
<ul>
<li>Bochurim go out, typically Friday afternoons, to streets, offices, and shops.</li>
<li>They ask Jewish men, "Did you put on tefillin today?", help them put them on, say Shema, and chat.</li>
<li>They also bring Shabbos candles to women and girls, and do holiday mivtzoyim (lulav, Chanukah, Purim).</li>
</ul>
<p><b>Doing it well.</b></p>
<ul>
<li>Friendly, never pushy. A "no" is fine.</li>
<li>Know the halacha: help with the bracha, the placement, and Shema.</li>
<li>Build relationships. Many mivtzoyim encounters become ongoing connections.</li>
<li>Never embarrass anyone.</li>
</ul>
<p><b>You.</b> You'll likely go on mivtzoyim from Mayanot. Back home, you're naturally positioned to reach friends from Palo Alto and business contacts.</p>`,

    id: "m11-6", title: "The Rebbe's ten mivtzoyim", minutes: 5, intro: false,
    teach: `
<p><b>The ten campaigns</b> the Rebbe launched, mostly between 1967 and 1975:</p>
<ol>
<li><b>Ahavas Yisrael:</b> love every Jew.</li>
<li><b>Chinuch:</b> Jewish education for every child.</li>
<li><b>Torah study:</b> set daily times for learning.</li>
<li><b>Tefillin.</b></li>
<li><b>Mezuzah:</b> a kosher mezuzah on every door. Launched in 1974, after the Maalot terror attack, as a source of protection.</li>
<li><b>Tzedakah:</b> give daily, including a tzedakah box in every home.</li>
<li><b>Bayis malei sefarim:</b> a home full of Jewish books.</li>
<li><b>Shabbos and Yom Tov candles</b> (Neshek): for women and girls, from age 3.</li>
<li><b>Kashrus.</b></li>
<li><b>Taharas hamishpacha:</b> family purity laws.</li>
</ol>
<p><b>The logic.</b> Each is a basic mitzvah that any Jew can take on, and that affects the home and the family. Together they cover the person, the home, and the community.</p>
<p><b>Other campaigns</b> came later: Moshiach, the Noahide laws for non-Jews, the Jewish birthday, Rambam study, children's campaigns (Tzivos Hashem), and more.</p>
<p><b>For you.</b> Which of the ten do you already keep fully? Which one could you strengthen: a tzedakah box in your room, a Jewish book collection, checking your mezuzah?</p>`,

    id: "m11-7", title: "Niggunim", minutes: 5, intro: false,
    teach: `
<p><b>What a niggun is.</b> A Chassidic melody, often without words. Chassidus teaches that music expresses what words can't. A famous saying, attributed to the Alter Rebbe: "Words are the pen of the heart; melody is the pen of the soul."</p>
<p><b>Types.</b></p>
<ul>
<li><b>Niggunei devekus / hisbonenus:</b> slow, deep, contemplative. They're sung before davening or at the start of a farbrengen, to prepare the soul.</li>
<li><b>Freilicher niggunim:</b> lively and joyous, for dancing and celebration.</li>
</ul>
<p><b>Famous Chabad niggunim.</b></p>
<ul>
<li><b>The Alter Rebbe's Niggun of Four Stanzas (Dalet Bavos).</b> Sung at weddings under the chuppah, and on special occasions. It's considered especially holy, and chassidim treat it with great respect.</li>
<li><b>Napoleon's March:</b> sung after Neilah on Yom Kippur.</li>
<li><b>Niggunim of each Rebbe,</b> sung on their special days.</li>
<li><b>Niggunim the Rebbe taught</b> at farbrengens, many sung to verses (e.g., "Tzama Lecha Nafshi", "Hoshia Es Amecha").</li>
</ul>
<p><b>How to learn them.</b> Listen to recordings (there are Chabad niggun collections online), and sing at every farbrengen. After a few months you'll know the core ones.</p>
<p><b>The practice.</b> Chassidim sing a niggun before davening to prepare, or alone when feeling down, as a way back to joy.</p>`,

    id: "m11-8", title: "Chassidic Yiddish vocabulary", minutes: 5, intro: false,
    teach: `
<p><b>You'll hear these constantly.</b> Learn the meaning, and then use them naturally.</p>
<ul>
<li><b>Bochur</b> (pl. bochurim): a yeshiva student.</li>
<li><b>Tamim</b> (pl. temimim): a student of Tomchei Temimim.</li>
<li><b>Mashpia:</b> a mentor.</li>
<li><b>Shiur:</b> a class.</li>
<li><b>Seder:</b> a learning session.</li>
<li><b>Chavrusa:</b> a learning partner.</li>
<li><b>Zal:</b> the beis midrash.</li>
<li><b>Farbreng:</b> to hold a farbrengen.</li>
<li><b>Mashke:</b> drink.</li>
<li><b>L'chaim:</b> the toast.</li>
<li><b>Hachlatah:</b> a resolution.</li>
<li><b>Avodah:</b> inner service of Hashem.</li>
<li><b>Gashmiyus / ruchniyus:</b> physical / spiritual.</li>
<li><b>Chayus:</b> vitality. "He davens with chayus."</li>
<li><b>Geshmak:</b> delicious, enjoyable. "A geshmake vort" is a delightful Torah thought.</li>
<li><b>Mamash:</b> really, literally.</li>
<li><b>Heimish:</b> homey, familiar.</li>
<li><b>Freilach:</b> joyous.</li>
<li><b>Nu:</b> "well?", "so?", "come on".</li>
<li><b>Shlep:</b> drag.</li>
<li><b>Gevaldig:</b> tremendous.</li>
<li><b>Chap arein:</b> grab the opportunity.</li>
<li><b>Kvetch:</b> complain.</li>
<li><b>Nisht geferlach:</b> "not terrible", meaning it's fine.</li>
<li><b>Yashar koach</b> (often "shkoyach"): thanks, well done.</li>

<li><b>Kvutza:</b> the year bochurim spend learning at 770.</li>
</ul>
<p><b>Using it well.</b> Yiddishisms sound natural when you understand them and use them sparingly. Overused, they sound like a costume. Lesson m13-8 is about this.</p>`,

    id: "m10-1", title: "Honesty in business", minutes: 5, intro: false,
    teach: `
<p><b>The first question.</b> The Gemara (Shabbos 31a) says that after 120 years, the first question a person is asked in Heaven is: "<i>Nasata v'nasata b'emunah?</i>" Did you conduct business honestly? Before Torah learning, before anything else.</p>
<p><b>The laws.</b></p>
<ul>
<li><b>Ona'ah (overcharging):</b> charging significantly above the market price. A difference of a sixth or more can void the sale (Bava Metzia 50b; Shulchan Aruch, Choshen Mishpat 227). Ona'as devarim, hurtful words, is also forbidden.</li>
<li><b>Geneivas da'as (deception):</b> creating a false impression, even without lying outright (Chullin 94a). Misleading "before and after" photos, fake urgency ("only 2 spots left!" when it isn't true), or implying a product is premium when it isn't.</li>
<li><b>Bal talin:</b> paying workers on time (Vayikra 19:13, Devarim 24:15). If you or Ari have employees or contractors, pay them when due.</li>
<li><b>Honest weights and measures</b> (Vayikra 19:35 to 36): in your world, honest time estimates and honest descriptions of services.</li>
</ul>
<p><b>Your business.</b> Pricing, customer messaging, and operations are exactly your job. The questions to ask yourself:</p>
<ul>
<li>Is our pricing fair to the market?</li>
<li>Do our photos and descriptions match what we deliver?</li>
<li>Do we fix problems honestly?</li>
<li>Do we treat Ari fairly?</li>
</ul>
<p><b>Kiddush Hashem.</b> An observant Jew known for honest business sanctifies Hashem's name (Yoma 86a).</p>`,

<p><b>What it is.</b> Giving a tenth of your income to tzedakah (<i>maaser kesafim</i>). The ideal is up to a fifth (<i>chomesh</i>). The Gemara (Kesubos 50a) says not to give more than a fifth, so as not to become dependent on others yourself.</p>
<p><b>The promise.</b> "Aser bishvil shetis'asher", give a tenth so that you'll become wealthy (Taanis 9a). Tzedakah is the one area where the Gemara permits "testing" Hashem: "Bring the tithe... and test Me with this" (Malachi 3:10).</p>
<p><b>How to calculate.</b> Maaser is generally calculated on net income, meaning profit after business expenses. There are many details: taxes, what counts as income, and how to count a business's profit versus personal draws. <b>Get a rav's guidance on your case</b> and set up a clear system.</p>
<p><b>A system that works.</b></p>
<ul>
<li>Open a separate account or tracking sheet for maaser.</li>
<li>Every time you receive profit, move 10% there immediately.</li>
<li>Give from it with thought: Torah institutions, the poor, your yeshiva, your local Chabad house.</li>
</ul>
<p><b>Daily tzedakah.</b> The Rebbe encouraged giving tzedakah every weekday, even a coin. The frequency trains the heart. (Chabad also gives before davening, as covered in lesson m2-5.)</p>
<p><b>The Chassidic idea.</b> Tanya (ch. 37, and Iggeres HaKodesh) calls tzedakah the mitzvah most comparable to all the others. You give the money you worked for, which represents your whole effort and life-energy.</p>`,

    id: "m10-3", title: "Bitachon and parnassah", minutes: 5, intro: false,
    teach: `
<p><b>Income is set.</b> The Gemara (Beitzah 16a) says a person's income for the year is decreed on Rosh Hashanah, except for what he spends on Shabbos, Yom Tov, and his children's Torah education. For those expenses, "if he spends more, he's given more".</p>
<p><b>So why work?</b> Because Hashem wants His blessing to come through natural channels. "Hashem your G-d will bless you in all that you do" (Devarim 15:18): you must "do". The effort (<i>hishtadlus</i>) is the vessel, and the blessing fills it. Chassidus teaches that the effort should be reasonable, not obsessive. Obsessive effort shows a lack of bitachon.</p>
<p><b>What bitachon looks like in business.</b></p>
<ul>
<li>Do the work well, efficiently, and honestly.</li>
<li>Keep Shabbos, even when it seems to cost money: that's an expense \"added back\".</li>
<li>Give maaser.</li>
<li>Don't panic over a slow week, or become arrogant over a good one.</li>
<li>Stop checking numbers compulsively.</li>
</ul>
<p><b>The Tzemach Tzedek.</b> "Tracht gut vet zain gut" (lesson m1-5). The Rebbe explained it: trusting Hashem for visible good is itself what draws the good.</p>
<p><b>Your situation.</b> You're 18, running a business remotely from Israel while learning full-time. The business may grow more slowly this year. Bitachon means doing your part within the limits of your commitments, and trusting that this year of Torah isn't a loss for the business.</p>`,

    teach: `
<p><b>The Rambam.</b> "Since keeping the body healthy and whole is part of the ways of Hashem, because a person can't understand or know anything of the Creator when sick, a person must avoid what harms the body and accustom himself to what heals it" (Hilchos Deos 4:1). His guidance in ch. 4 includes:</p>
<ul>
<li><b>Exercise:</b> "as long as a person exercises and exerts himself... no sickness will come to him" (4:14).</li>
<li><b>Eating:</b> eat until about three-quarters full, not until completely full (4:2).</li>
<li><b>Sleep</b> and regular habits.</li>
</ul>
<p><b>Hillel.</b> The Midrash (Vayikra Rabbah 34:3) tells that Hillel said bathing is a mitzvah: if the king's statues are cleaned, how much more the body, created in Hashem's image.</p>
<p><b>Chassidus.</b> The body isn't the enemy. It's the vehicle of the G-dly soul and the place where mitzvos happen. A healthy, strong body means more energy for Torah and mitzvos. That's kelipas noga elevated (lesson m8-4). The Rebbe, in many letters, advised people to exercise, walk, eat well, and rest, and he was concerned when people neglected their health for "spiritual" reasons.</p>
<p><b>Your training.</b></p>
<ul>
<li><b>Intention:</b> train to have strength and energy to serve Hashem.</li>
<li><b>Priorities:</b> don't let training crowd out davening or seder.</li>
<li><b>Modesty:</b> gym settings raise questions about dress, mixed environments, and music. Ask Zalmy for practical guidance.</li>
<li><b>Fasts:</b> plan hydration and training around them.</li>
</ul>`,

    id: "m10-5", title: "Ahavas Yisrael", minutes: 5, intro: false,
    teach: `
<p><b>The mitzvah.</b> "Love your fellow as yourself" (Vayikra 19:18). Rabbi Akiva called it "a great principle of the Torah". Hillel told a would-be convert: "What is hateful to you, don't do to your fellow. That's the whole Torah; the rest is commentary. Go learn" (Shabbos 31a).</p>
<p><b>Tanya ch. 32.</b> The Alter Rebbe explains how this mitzvah is possible. Bodies are separate, but souls are one: all Jewish souls come from the same source, "like brothers from one father". A person who makes his soul primary and his body secondary will naturally love every Jew. Tanya adds that even someone who sins is to be loved, and brought close to Torah. You hate the evil in him, not him. It cites Aharon's approach: "love people and bring them close to Torah" (Avos 1:12).</p>
<p><b>Chabad.</b> Ahavas Yisrael is the first of the Rebbe's ten mivtzoyim, and it's why Chabad houses exist: every Jew, whatever his background, is welcome. The Rebbe taught that ahavas Yisrael should be unconditional (<i>ahavas chinam</i>), which is the repair for the destruction.</p>
<p><b>Practical.</b></p>
<ul>
<li>Speak well of others; avoid lashon hara.</li>
<li>Help someone who can't pay you back.</li>
<li>Make the new guy at Mayanot feel welcome.</li>
<li>Judge favorably (<i>dan l'chaf zechus</i>, Avos 1:6).</li>
</ul>
<p>At the start of every Shacharis, you say "Hareini mekabel" (lesson m2-5). Mean it.</p>`,

      { id: "m10-5-q1", t: "mc", q: "Tanya ch. 32 explains that ahavas Yisrael is possible because:", o: ["All Jewish souls are one at their source", "People are nice", "It's commanded", "Bodies are the same"], a: 0, x: "Like brothers from one father." },

  {
    id: "m10-6", title: "Chassidishe friendship", minutes: 5, intro: false,
    teach: `
<p><b>"Acquire for yourself a friend."</b> The Mishnah (Avos 1:6) says "make for yourself a teacher, and acquire for yourself a friend". Friendship takes investment: time, honesty, and sometimes cost.</p>
<p><b>Two G-dly souls against one.</b> A famous Chassidic saying: when two Jews talk together about serving Hashem, there are two G-dly souls against one animal soul. Each person's G-dly soul helps the other's, so together they're stronger than each alone. That's the logic of a chavrusa, a farbrengen, and a real friendship.</p>
<p><b>What makes it Chassidish.</b></p>
<ul>
<li><b>Honesty:</b> telling a friend what he needs to hear, with love.</li>
<li><b>Shared goals:</b> growing together in avodah, not just hanging out.</li>
<li><b>Commitment:</b> being there in hard times.</li>
<li><b>No jealousy:</b> celebrating a friend's success.</li>
</ul>
<p><b>Your situation.</b> Close friendships matter a lot to you. Two circles:</p>
<ul>
<li><b>Friends from home:</b> you're changing. Keep the friendships alive. Don't preach, don't hide who you are, and let them see you're still you. The Rebbe's approach was warmth first.</li>

    teach: `
<p><b>The Rambam's golden path.</b> For most traits, the ideal is the middle path (<i>derech hamemutza</i>, Hilchos Deos 1 to 2): not stingy and not wasteful, not lazy and not frantic. Two exceptions, where you go to the extreme (Deos 2:3):</p>
<ul>
<li><b>Arrogance:</b> go to the extreme of humility.</li>
<li><b>Anger:</b> avoid it almost entirely. Chazal compare someone who gets angry to one who worships idols (Shabbos 105b).</li>
</ul>
<p>To fix a trait, the Rambam advises going to the opposite extreme for a while, and then settling in the middle.</p>
<p><b>The Chassidic approach.</b> Chassidus works on middos through the mind. Understanding deeply (hisbonenus) changes how you feel. For example, anger at a customer comes from ego ("how dare he"). Contemplating that everything is from Hashem, and that the customer is also a soul, reduces the anger at its root. Iskafya (lesson m8-12) handles the behavior while the understanding works on the feeling.</p>
<p><b>A method.</b></p>
<ol>
<li>Pick one middah: the one that costs you most.</li>
<li>Learn about it: Tanya, Rambam Deos, a maamar.</li>
<li>Set a small, specific behavior: "When a customer is rude, I wait 10 minutes before replying."</li>
<li>Track it daily for a month.</li>
<li>Review with your mashpia.</li>
</ol>
<p><b>Why it matters.</b> Middos are the foundation for everything else. Character is what you bring to a marriage, a business partnership, and a friendship.</p>`,

    id: "m10-8", title: "Cheshbon hanefesh", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> A spiritual self-accounting: an honest review of how you're doing. Like a business owner reviewing the books, you look at what went well, what went wrong, and what to change.</p>
<p><b>When.</b></p>
<ul>
<li><b>Nightly,</b> before Kriyas Shema al HaMitah (lesson m2-11): a short review of the day.</li>
<li><b>Monthly,</b> on Erev Rosh Chodesh. Some call it "Yom Kippur Katan".</li>
<li><b>Yearly,</b> in Elul, especially from Chai Elul (lesson m7-9).</li>
</ul>
<p><b>How: Tanya's balance.</b> Tanya (ch. 29 to 31) says to feel bitterness over failings (<i>merirus</i>) at set times, not all the time. Then move to joy. Constant self-criticism becomes atzvus and paralyzes. The point of cheshbon hanefesh is change, not guilt.</p>
<p><b>A simple nightly format</b> (2 minutes):</p>
<ol>
<li>Thought, speech, action: where did each go right, and where wrong?</li>
<li>One thing to fix tomorrow.</li>
<li>One thing you did well. Thank Hashem.</li>
<li>Hareini mochel: forgive others.</li>
<li>Sleep in peace.</li>
</ol>
<p><b>For you.</b> You like data and tracking. The Tracker in this app is a practical form of cheshbon hanefesh: Chitas, Rambam, and Do It Today, day by day. Look at it weekly, honestly.</p>`,

<li><b>B'ezras Hashem (B"EH) / Im yirtzeh Hashem:</b> "with Hashem's help" / "if Hashem wills". Said about plans: "I'll be there tomorrow, b'ezras Hashem."</li>
<li><b>B'li neder:</b> "without a vow". Said when committing to something, so it isn't a halachic vow: "I'll learn with you tomorrow, b'li neder."</li>
<li><b>Gut Shabbos / Gut voch / Gut chodesh / Gut Yom Tov:</b> the greetings for each occasion.</li>
<li><b>Yasher koach (shkoyach):</b> thanks, well done. Also said after an aliyah.</li>
<li><b>Kol tuv:</b> "all the best". A farewell, including in emails.</li>
<li><b>Moshiach now / We want Moshiach now:</b> a Chabad slogan popularized at the Rebbe's farbrengens; it's also sung.</li>
<li><b>Ad me'ah v'esrim:</b> "until 120". A wish for long life, said on birthdays.</li>
<li><b>Mazal tov:</b> on happy occasions.</li>
<li><b>B'sha'ah tovah:</b> "at a good time". Said about a pregnancy or engagement news, not \"mazal tov\" until the birth.</li>

    id: "m13-4", title: "The Rebbe's famous lines", minutes: 5, intro: false,
    teach: `
<p><b>Lines associated with the Rebbe.</b> Some are direct quotes, and some are widely attributed. It's honest to say "the Rebbe said" only when you know the source; otherwise, say "the Rebbe is quoted as saying".</p>
<ul>
<li><b>"A little light dispels a lot of darkness."</b> An idea the Rebbe often repeated, rooted in Chassidic teaching (and Tanya). You don't fight darkness; you add light.</li>
<li><b>"Do all you can to bring Moshiach."</b> From the sicha of 28 Nissan 5751 (1991): the Rebbe said he'd done what he could and handed the mission to his chassidim.</li>
<li><b>"If you know alef, teach alef."</b> Widely attributed to the Rebbe: you don't need to be an expert to share what you know. Everyone is a teacher.</li>
<li><b>"Ufaratzta."</b> "You shall spread out west, east, north, and south" (Bereishis 28:14). A Chabad slogan for shlichus, sung as a niggun.</li>
<li><b>"The world is ready."</b> A theme of the Rebbe's later sichos: the world is prepared for the geulah.</li>
<li><b>"Every Jew is a shliach."</b> The idea (from many sichos) that every Jew is sent to make his environment a home for Hashem.</li>
</ul>

    teach: `
<p><b>What Hayom Yom is.</b> A daily calendar compiled by the Rebbe in 1943 at the Frierdiker Rebbe's request. Each day has a short teaching, custom, or saying, mostly from the Frierdiker Rebbe's talks and letters. Chassidim learn it daily and quote it often: "It says in Hayom Yom..."</p>
<p><b>Ideas quoted in Hayom Yom that you'll hear:</b></p>
<ul>
<li><b>Living with the times:</b> the Alter Rebbe's teaching about living with the weekly parsha (lesson m13-3).</li>
<li><b>Learning from everything:</b> the Baal Shem Tov's teaching that from everything a person sees or hears, he should learn a lesson in serving Hashem (lesson m8-11).</li>
<li><b>Customs:</b> much of what you do in Chabad, like Tehillim after davening, Chitas, and the Shabbos Mevarchim Tehillim, is recorded in Hayom Yom.</li>
</ul>
<p><b>How to really know Hayom Yom.</b> Read it daily. It's one paragraph. After a year, you'll have read the whole thing and will recognize the lines when they're quoted. That's worth more than memorizing a list. An honest note: this app gives you only a few lines here on purpose, since quoting exact dates from memory risks errors.</p>
<p><b>Using it.</b> When you share a Hayom Yom line, say what day it's from, or say "Hayom Yom says". Chassidim will know it. If you're not sure of the day, say "somewhere in Hayom Yom". That's honest and normal.</p>`,

<p><b>The words of yeshiva life.</b></p>
<ul>
<li><b>Seder:</b> a set learning period. Shacharis seder, Chassidus seder, night seder.</li>
<li><b>Chavrusa:</b> a learning partner, and also the learning session itself.</li>
<li><b>Shiur:</b> a class given by a teacher.</li>
<li><b>Sugya:</b> a topic in the Gemara.</li>
<li><b>Iyun / bekius:</b> learning in depth / learning for breadth.</li>
<li><b>Chazara:</b> review.</li>
<li><b>Maamar:</b> a formal Chassidic discourse, said or written by a Rebbe.</li>
<li><b>Sicha:</b> a talk by the Rebbe.</li>
<li><b>Hanhala:</b> the yeshiva's administration.</li>
<li><b>Mashgiach:</b> a supervisor of the bochurim's conduct.</li>
<li><b>Rosh yeshiva:</b> the head of the yeshiva.</li>
<li><b>Zal:</b> the beis midrash, the main study hall.</li>
<li><b>Chassidus seder:</b> the morning period for learning Chassidus before davening, a Chabad yeshiva staple.</li>
<li><b>Mivtzoyim:</b> outreach outings.</li>
<li><b>Shabbos Mevarchim:</b> Tehillim and a farbrengen.</li>
<li><b>Kinus:</b> a gathering or conference, like the Kinus HaShluchim.</li>
<li><b>Kvutza:</b> the year at 770 after yeshiva.</li>
<li><b>Smicha:</b> rabbinic ordination.</li>
</ul>
<p><b>Your schedule.</b> Knowing the vocabulary lets you follow what's happening. You said you have free time after night seder. That's the classic time chassidim use for chazara or Chitas.</p>`,

    id: "m13-8", title: "When not to use them", minutes: 5, intro: false,
    teach: `
<p><b>The point of this module</b> was that you actually understand what you're saying. This last lesson is about using that knowledge well.</p>
<p><b>Don't use it as a costume.</b> Dropping Yiddishisms and quotes to seem more Chabad than you are is chitzoniyus. Chassidim can tell, and it doesn't help you grow. Use phrases when they come naturally and when you understand them.</p>
<p><b>Know your audience.</b></p>
<ul>
<li><b>With friends from home or non-religious family:</b> translate. "Baruch Hashem" is fine; "I'm working on my iskafya" needs explaining, or other words.</li>
<li><b>With customers and business contacts:</b> keep it professional. "B'ezras Hashem" in a business email may or may not fit. Judge each case.</li>
<li><b>With other Orthodox Jews who aren't Chabad:</b> some terms, like "the Rebbe" alone, mean something different to them. Be clear.</li>
</ul>
<p><b>Don't correct people publicly.</b> If someone mispronounces or misuses a term, it's rarely worth correcting unless they ask. Ahavas Yisrael beats being right.</p>
<p><b>Humility.</b> You're 18, a few months into this. Speak with confidence about what you know, and say "I'm not sure" about what you don't. That's exactly what the Rebbe modeled: "If you know alef, teach alef", and not more.</p>
<p><b>The real test.</b> Not how you talk at a farbrengen, but how you act on Sunday: in business, with friends, in davening. Speech follows.</p>`,

    teach: `
<p><b>Two halves of one soul.</b> The Zohar teaches that a husband and wife are two halves of one soul, separated before birth and reunited in marriage. Marriage isn't two separate people making a deal. It's a reunion, which is why finding the right one matters so much, and why it's approached with prayer and seriousness.</p>
<p><b>The purpose.</b> "It isn't good for man to be alone" (Bereishis 2:18). A Jewish home is called a <i>mikdash me'at</i>, a small sanctuary: a place where Hashem dwells. That's dirah b'tachtonim at its most concrete. Chassidus sees marriage and raising a family as central to a person's mission, not something that competes with spiritual life.</p>
<p><b>The Rebbe's approach.</b></p>
<ul>
<li>The Rebbe encouraged marrying at a reasonable, not late, age: for bochurim, after their yeshiva years, often in their early twenties.</li>
<li>He encouraged dating purposefully, with marriage in mind, through a shidduch process involving parents or a shadchan, and never casually.</li>
<li>In many letters (Igros Kodesh) he gave guidance on shidduchim, often emphasizing good middos, shared values, and not being overly picky about externals.</li>
</ul>
<p><b>Shlichus couples.</b> Many Chabad couples go on shlichus together. The wife is a full partner in the mission.</p>
<p><b>For now.</b> You said this is later and lower priority. Right. But the work that matters most for marriage is happening now: middos, stability, learning, and knowing who you are.</p>`,

  {
    id: "m12-2", title: "Mezuzah", minutes: 5, intro: false,
    teach: `
<p><b>The mitzvah.</b> "Write them on the doorposts of your house and on your gates" (Devarim 6:9, 11:20). A mezuzah is a parchment scroll, handwritten by a sofer, containing Shema and V'haya im shamoa. The case is just a cover. What matters is a kosher scroll.</p>
<p><b>Where.</b></p>
<ul>
<li>On the right side of the doorway as you enter.</li>
<li>In the upper third of the doorpost, but at least a handbreadth from the top.</li>
<li>On every door of the home that meets the requirements, not only the front door. The exceptions include bathrooms, and doorways without the right structure.</li>
</ul>
<p>Ashkenazim, including most Chabad, affix it at a slant, with the top pointing inward. Confirm details with Zalmy.</p>
<p><b>The bracha</b> is <i>likbo'a mezuzah</i>, said when affixing it.</p>
<p><b>When.</b></p>
<ul>
<li><b>In Israel:</b> a rented home needs a mezuzah immediately.</li>
<li><b>In chutz la'aretz:</b> a rented home needs one after 30 days. Many put it up right away without a bracha, and add the bracha later.</li>
</ul>
<p><b>Checking.</b> The halacha is to check a mezuzah twice in seven years (Shulchan Aruch, Yoreh De'ah 291). Chabad commonly checks every year in Elul. Letters fade and crack, and a mezuzah that has become invalid needs replacing.</p>
<p><b>Mivtza mezuzah.</b> The Rebbe launched it in 1974, after the Maalot attack, emphasizing the mezuzah as protection: "Hashem guards your going out and your coming in" (Tehillim 121:8).</p>
<p><b>Your room.</b> Is there a mezuzah on your dorm room at Mayanot? Is it kosher? And your business location in the Bay Area, if there is one?</p>`,

    id: "m12-3", title: "Shalom bayis", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> Peace in the home: harmony, respect, and love between husband and wife. It's one of the highest values in Jewish life.</p>
<p><b>How important?</b> In the sotah ritual, Hashem allows His own name to be erased in water to restore peace between husband and wife (Chullin 141a; Shabbos 116a). If Hashem sets aside His honor for shalom bayis, so should we.</p>
<p><b>The halacha.</b> The Rambam (Hilchos Ishus 15:19 to 20) writes that a husband should honor his wife more than himself and love her as himself. The Gemara (Bava Metzia 59a) says a person should always be careful with his wife's honor, because blessing comes into a home only in her merit. "Honor your wives, so that you'll become wealthy."</p>
<p><b>What builds it.</b></p>
<ul>
<li><b>Middos:</b> patience, humility, and controlling anger (lesson m10-7).</li>
<li><b>Listening, really listening.</b></li>
<li><b>Giving without keeping score.</b></li>
<li><b>Handling disagreement respectfully.</b></li>
<li><b>Time together.</b></li>
</ul>
<p>The Rebbe gave shalom bayis advice in many letters, often pointing to the man's responsibility to give, and to seek guidance early rather than late.</p>
<p><b>Now.</b> The traits that make shalom bayis are built long before marriage: how you treat your parents, your friends, Ari, and customers. How you handle conflict with Ari is practice for marriage.</p>`,

    id: "m12-4", title: "What to know long before dating", minutes: 5, intro: false,
    teach: `
<p><b>Dating in the Chabad world</b> is for marriage. It usually starts when a bochur is ready (typically after the yeshiva years), through a shidduch process: parents, a shadchan, and a mashpia are involved. Dates are purposeful conversations to see if this is the person to build a home with. It isn't casual dating.</p>
<p><b>Halachos to know now.</b></p>
<ul>
<li><b>Shemiras negiah:</b> no physical contact with women other than immediate family, until marriage.</li>
<li><b>Yichud:</b> a man and woman who aren't married (or closely related) must not be secluded together in a closed private space. The laws are detailed; learn them before you need them.</li>
<li><b>Tznius:</b> modesty in dress, speech, and conduct, for men too.</li>
<li><b>Taharas hamishpacha</b> (family purity): learned thoroughly with a teacher before the wedding, in chosson classes. It's one of the Rebbe's ten mivtzoyim, and a foundation of the Jewish home.</li>
</ul>
<p><b>What to build now.</b></p>
<ul>
<li><b>Your middos.</b></li>
<li><b>A stable relationship with learning and davening.</b></li>
<li><b>Financial responsibility:</b> the business, if it continues, is part of readiness.</li>
<li><b>Knowing yourself:</b> what you want in a home.</li>
<li><b>A mashpia you trust,</b> who will guide you through the process.</li>
</ul>
<p><b>Your background.</b> You grew up traditional, not Chabad. When the time comes, your family's involvement, and how they see your path, will matter. Keeping that relationship warm now is part of the preparation.</p>`,

  {
    id: "m12-5", title: "Talking to your mashpia about it", minutes: 5, intro: false,
    teach: `
<p><b>Why a mashpia.</b> Marriage is the biggest decision of your life. Chassidim don't go into it alone. A mashpia who knows you can help you:</p>
<ul>
<li>Know when you're ready.</li>
<li>Think through what matters in a spouse.</li>
<li>Handle the shidduch process, and your family's role in it.</li>
<li>Avoid mistakes that come from inexperience.</li>
</ul>
<p><b>When to start the conversation.</b> Before you begin dating, not in the middle of it. A good time: toward the end of your yeshiva years, or whenever you start thinking seriously about it.</p>
<p><b>What to bring.</b></p>
<ul>
<li>Your honest sense of readiness, spiritually, emotionally, and financially.</li>
<li>Your family's situation and expectations.</li>
<li>What you're looking for, and why.</li>
<li>Your questions, including awkward ones. That's what a mashpia is for.</li>
</ul>
<p><b>Writing to the Ohel.</b> Many chassidim also write to the Rebbe (a pan, at the Ohel) before starting shidduchim, and at important points in the process.</p>
<p><b>The course, looking back.</b> You started this app knowing Pesach, some brachos, and the basics of Tanya. Everything here, from Shabbos and brachos to Tanya and middos, is preparation for building a home that is a mikdash me'at. There's no rush. Build it right.</p>
<p class="flag">Specific personal guidance: ask Zalmy or your mashpia.</p>`,

  melachosIntro: "The Torah juxtaposes Shabbos with building the Mishkan. The Gemara (Shabbos 49b) derives that the forbidden categories of work are the kinds of work used to build it. Grouping follows the Mishnah's order (Shabbos 7:2).",

    { g: "Making cloth", why: "Producing the wool and linen curtains of the Mishkan.", items: [
      { n: "Gozez", h: "גוזז", m: "Shearing", ex: "Cutting hair or nails" },

    { g: "Fire", why: "Fire was used for cooking dyes and working metal.", items: [
