    id: "m4-14", title: "Chabad Shabbos customs", minutes: 5, intro: false,
    teach: `
<p><b>Preparation.</b> Chazal say "whoever toils on Erev Shabbos eats on Shabbos" (Avodah Zarah 3a). Chabad customs for Friday include:</p>
<ul>
<li><b>Shnayim mikra v'echad targum:</b> reading the week's parsha twice in Hebrew and once in Targum Onkelos, a halacha the Alter Rebbe emphasizes.</li>
<li><b>Mikvah on Erev Shabbos:</b> a strong Chabad practice for men.</li>
<li><b>Tzedakah:</b> giving before Shabbos, including before lighting candles.</li>
</ul>
<p><b>Shabbos is for Chassidus and davening.</b> The Rebbeim said many of their maamarim on Shabbos. Chabad chassidim daven longer on Shabbos (<i>b'arichus</i>), with more contemplation, and learn Chassidus. Weekday matters are pushed out of mind and speech.</p>
<p><b>Shabbos Mevarchim.</b> On the Shabbos before Rosh Chodesh, the Frierdiker Rebbe instituted saying the entire Tehillim before Shacharis. Chabad shuls say it together early in the morning. A farbrengen usually follows davening.</p>
<p><b>Nigunim and farbrengens.</b> Shabbos afternoons are prime farbrengen time, especially Shabbos Mevarchim and special dates.</p>
<p><b>Chitas on Shabbos.</b> Daily shiurim continue: the seventh aliyah of the parsha, the Tehillim for the day of the month, and the Tanya portion.</p>
<p><b>Other things you'll see.</b> Chabad follows the Alter Rebbe's siddur for Kabbalas Shabbos, Kiddush, and zemiros. The details are best learned by watching at Mayanot and asking. Don't invent your own minhagim from the internet.</p>`,

    id: "m4-15", title: "Business: time zones and when Shabbos ends", minutes: 5, intro: false,
    teach: `
<p><b>The halacha follows where you are.</b> Your Shabbos runs by Jerusalem time. The Bay Area's Shabbos doesn't change yours.</p>
<p><b>The math.</b> The Bay Area is usually <b>10 hours behind Israel</b>. It's briefly 9 or 11 hours when the countries switch clocks on different dates.</p>
<ul>
<li><b>Your Shabbos starts</b> at candle lighting Friday (about 5 to 6:30 p.m. in Jerusalem, depending on the season). That's about <b>7 to 8:30 a.m. Friday in California</b>.</li>
<li><b>Your Shabbos ends</b> at nightfall Saturday (about 6 to 8 p.m. in Jerusalem). That's about <b>8 to 10 a.m. Saturday in California</b>.</li>
</ul>
<p>So your business "blackout" window is essentially <b>Friday morning to Saturday morning, Pacific time</b>. Friday is often a busy day for a detailing business, which is why this matters.</p>
<p><b>Planning.</b></p>
<ul>
<li>Schedule customer-facing work so nothing requires you between Friday 7 a.m. and Saturday 10 a.m. PT.</li>
<li>Close out Friday bookings on Thursday night, Israel time.</li>
<li>Tell customers clearly (in auto-replies, on the website) when you're unavailable, without needing to explain.</li>
</ul>
<p><b>Yom Tov.</b> The same applies to Yom Tov, including Yom Tov Sheni if you keep two days. Map out the whole year's Yamim Tovim with Ari in advance.</p>
<p class="flag">How your business may operate during your Shabbos is covered in the next two lessons. Confirm with a rav.</p>`,

    teach: `
<p><b>Two questions.</b> Can the business operate on Shabbos while you keep it? And can you profit from what happens on Shabbos?</p>
<p><b>Sechar Shabbos.</b> Earning wages specifically for Shabbos work is rabbinically forbidden, even for permitted work. When Shabbos is included in a larger unit (weekly, monthly), it's permitted (<i>havla'ah</i>, Shulchan Aruch 306:4).</p>
<p><b>A partner who is not Jewish.</b> The Shulchan Aruch (Orach Chaim 245:1) describes a standard arrangement. If agreed at the start of the partnership, the non-Jewish partner takes the profits of Shabbos and the Jew takes the profits of another day. The non-Jew is then working for himself on Shabbos. Without such an arrangement, profits from Shabbos are problematic. This is often called a "Shabbos partnership".</p>
<p><b>A partner who is Jewish.</b> This is more complicated.</p>
<ul>
<li>You can't be a party to a Jew doing melacha on his Shabbos (lifnei iver, mesayea).</li>
<li>If the business runs on Saturday in California with Ari working, poskim discuss whether you can own part of it, and what arrangements (like a sale of your share for Shabbos, or restructuring) are needed.</li>
<li>If jobs happen only on weekdays, much of the problem falls away, though your Shabbos window (Friday morning PT) still matters.</li>
</ul>
<p><b>What Ari can do on your behalf.</b> Anything he does as your agent on Shabbos is a question. A clean handover before your Shabbos, with Ari acting for himself during it, is part of most solutions.</p>
<p class="flag">This is a real financial halacha question with serious stakes. Don't self-rule. Bring it to a rav who knows business halacha. Confirm with a rav.</p>`,

    id: "m3-1", title: "Why brachos, and the six brachos rishonos", minutes: 5, intro: true,
    teach: `
<p><b>Why.</b> The Gemara (Berachos 35a) points out two verses. "The earth and everything in it belong to Hashem" (Tehillim 24:1), and "the earth He gave to people" (Tehillim 115:16). Before the bracha, the food is Hashem's; after the bracha, it's given to you. Eating without a bracha is compared to misusing hekdesh, sacred property. Chassidus adds that a bracha elevates the food: the G-dly spark in it is released and joined to its source.</p>
<p><b>The six brachos rishonos</b> (before eating):</p>
<ul>
<li><b>Hamotzi:</b> bread from the five grains.</li>
<li><b>Mezonos</b> (borei minei mezonos): other grain products, and rice.</li>
<li><b>Hagafen</b> (borei pri hagafen): wine and grape juice.</li>
<li><b>Ha'etz</b> (borei pri ha'etz): fruit of trees.</li>
<li><b>Ha'adama</b> (borei pri ha'adama): produce of the ground.</li>
<li><b>Shehakol</b> (shehakol nihyeh bidvaro): everything else, like meat, dairy, drinks, and candy.</li>
</ul>
<p><b>The Chabad source.</b> The Alter Rebbe wrote <i>Seder Birchos HaNehenin</i>, a systematic code of the laws of brachos, printed in the Chabad siddur. When Chabad practice differs from other poskim on a food, this is where it comes from.</p>
<p><b>How to say it.</b></p>
<ul>
<li>Hold the food in your right hand.</li>
<li>Say the words clearly, with meaning.</li>
<li>Eat right away, with no interruption between the bracha and the first bite.</li>
</ul>
<p>If you hear someone's bracha, answer <i>amen</i>.</p>
<p><b>Your level.</b> In the interview you got potato chips and bananas right, and missed rice. The next lessons fix the rules.</p>`,

    id: "m3-2", title: "Brachos acharonos", minutes: 5, intro: true,
    teach: `
<p><b>The three types.</b></p>
<ul>
<li><b>Birkas Hamazon</b> (bentching): after bread. It's a Torah mitzvah when you're satisfied: "You will eat, be satisfied, and bless" (Devarim 8:10).</li>
<li><b>Me'ein shalosh</b>, the "three-in-one" bracha. It has three versions:
<ul>
<li><i>Al hamichya</i> after grain products from the five grains.</li>
<li><i>Al hagefen</i> after wine or grape juice.</li>
<li><i>Al ha'etz</i> after the five fruits of the seven species: grapes, figs, pomegranates, olives, dates.</li>
</ul>
They can be combined in one bracha.</li>
<li><b>Borei nefashos:</b> after everything else.</li>
</ul>
<p><b>The seven species</b> of Eretz Yisrael (Devarim 8:8): wheat, barley, grapes, figs, pomegranates, olives, dates. Grains (including spelt, oats, and rye as types of wheat and barley) take al hamichya, and the fruits take al ha'etz.</p>
<p><b>The minimum amounts.</b></p>
<ul>
<li><b>Food:</b> a k'zayis, eaten within a short time (k'dei achilas pras).</li>
<li><b>Drink:</b> a revi'is, drunk without a long break.</li>
</ul>
<p>Less than this, and no bracha acharona is said. The exact measurements are debated; Chabad uses the Alter Rebbe's measures. Ask Zalmy for practical sizes.</p>
<p><b>Time limit.</b> You can say the bracha acharona as long as you haven't digested the food, generally as long as you don't feel hungry from it. Many use 72 minutes as a guide for small amounts.</p>
<p><b>Rice.</b> It isn't one of the five grains, so after rice you say <b>borei nefashos</b>, even though before it you say mezonos. That's the one you missed.</p>`,

  {
    id: "m3-3", title: "Mezonos in depth (including rice)", minutes: 5, intro: false,
    teach: `
<p><b>The five grains.</b> Wheat, barley, spelt, oats, rye. Bread made from them is Hamotzi. Other products made from them are Mezonos.</p>
<p><b>What's Mezonos.</b></p>
<ul>
<li><b>Baked goods that aren't regular bread</b> (<i>pas haba'ah b'kisnin</i>): cake, cookies, crackers, pastries, pretzels. Lesson m3-9 covers when they become Hamotzi.</li>
<li><b>Cooked grain dishes:</b> pasta, oatmeal, barley in soup, couscous (wheat).</li>
<li><b>Rice.</b> The Gemara (Berachos 37a) rules that rice is Mezonos, because it satisfies like grain. But after rice the bracha is borei nefashos, since it isn't one of the five grains.</li>
</ul>
<p><b>Mezonos ingredient in a mixture.</b> When one of the five grains is added to a dish for substance or taste, not just as a binder, the whole dish is often Mezonos, even if the grain is the minority (Shulchan Aruch 208:2). If the flour is only a binder or thickener, it's secondary.</p>
<p><b>Other grains.</b></p>
<ul>
<li>Corn and quinoa aren't Mezonos: they're generally Ha'adama.</li>
<li>Buckwheat and millet: poskim discuss them. Ask.</li>
</ul>
<p><b>Why Mezonos is "higher" than other brachos.</b> Grain is the staple that sustains people. That's why its bracha is more specific, and why it comes first in the order of precedence.</p>`,

  {
    id: "m3-4", title: "Ha'etz vs. Ha'adama", minutes: 5, intro: false,
    teach: `
<p><b>What counts as a tree.</b> Halachically, a tree is a plant whose branches last from year to year and produce fruit again (Berachos 40a). A plant whose stem dies back and regrows from the ground is not a tree, even if it's tall.</p>
<ul>
<li><b>Banana:</b> the plant regrows from the root, so the fruit is Ha'adama.</li>
<li><b>Strawberries:</b> Ha'adama.</li>
<li><b>Pineapple:</b> Ha'adama.</li>
<li><b>Blueberries:</b> Ha'etz, since the bush's branches persist.</li>
<li><b>Papaya:</b> debated. Ask.</li>
</ul>
<p><b>If you got it wrong.</b></p>
<ul>
<li>Ha'adama on a tree fruit: you're covered after the fact, since trees also grow from the ground.</li>
<li>Ha'etz on a vegetable: you're not covered.</li>
<li>Shehakol: covers everything after the fact (Berachos 40a; Shulchan Aruch 206).</li>
</ul>
<p>If unsure, Shehakol is the fallback, but learn the right one.</p>
<p><b>Processed fruit and vegetables.</b></p>
<ul>
<li><b>Cooked</b> produce that's normally eaten cooked keeps its bracha.</li>
<li><b>Juice:</b> Shehakol, except grape juice, which is Hagafen.</li>
<li><b>Pureed or mashed</b> produce (applesauce, mashed potatoes): poskim discuss this. The Alter Rebbe's ruling is in Seder Birchos HaNehenin. Ask Zalmy for the Chabad practice on specific items.</li>
</ul>
<p><b>Nuts.</b> Almonds, walnuts, and cashews are Ha'etz. Peanuts grow in the ground: Ha'adama.</p>`,

    id: "m3-5", title: "Ikar and tafel", minutes: 5, intro: false,
    teach: `
<p><b>The rule.</b> When you eat two foods together and one is the main food (<i>ikar</i>) and the other is secondary (<i>tafel</i>), there to enhance or help you eat the main one, you say the bracha only on the ikar. It covers the tafel (Shulchan Aruch 212).</p>
<p><b>Examples.</b></p>
<ul>
<li><b>Cereal with milk:</b> the cereal is ikar. You got this right.</li>
<li><b>Crackers with a thin spread:</b> the cracker is ikar.</li>
<li><b>Apple dipped in honey:</b> Ha'etz covers the honey.</li>
<li><b>A shot of whiskey with a small bite of cake to chase it:</b> the drink is ikar, according to many. Ask for details.</li>
<li><b>Ice cream in a cone</b> used only as a holder: poskim discuss this. Ask.</li>
</ul>
<p><b>How to identify the ikar.</b></p>
<ol>
<li>What did you come to eat?</li>
<li>What's there only to help, carry, or flavor?</li>
<li>If both are equally wanted, it's not ikar and tafel. You say two brachos.</li>
</ol>
<p><b>Bread covers the meal.</b> Hamotzi covers everything eaten as part of the meal, since bread is the ikar of a meal. Dessert and fruit eaten for their own sake after the meal are discussed separately. Ask Zalmy what the practice is for fruit at the end of a meal.</p>
<p><b>Wine covers drinks.</b> Hagafen covers other drinks you drink with it (Shulchan Aruch 174).</p>`,

    id: "m3-6", title: "Order of precedence", minutes: 5, intro: false,
    teach: `
<p><b>When several foods are in front of you</b> that need different brachos, there's an order for which bracha to say first.</p>
<p><b>By bracha.</b> The more specific bracha comes first:</p>
<ol>
<li>Hamotzi</li>
<li>Mezonos</li>
<li>Hagafen</li>
<li>Ha'etz or Ha'adama</li>
<li>Shehakol</li>
</ol>
<p>A memory aid used in yeshivos: <b>MAGAS</b> (Mezonos, Hagafen, Ha'etz, Ha'adama, Shehakol), with Hamotzi above them all. Once you make Hamotzi, it covers the meal anyway.</p>
<p><b>Between Ha'etz and Ha'adama.</b> These are close in rank. The rules:</p>
<ul>
<li>A food from the <b>seven species</b> comes first.</li>
<li>Otherwise, the food you like more (<i>chaviv</i>) comes first.</li>
<li>If they're equal, Ha'etz comes first according to many.</li>
</ul>
<p>The Alter Rebbe works through the details in Seder Birchos HaNehenin. Ask Zalmy if you want the exact Chabad ruling for a case.</p>
<p><b>After the fact.</b> If you said the brachos in the wrong order, you're still covered. The order is l'chatchila.</p>
<p><b>Practical.</b> A Shabbos kiddush with cake, fruit, and drinks: Mezonos on the cake, then Ha'etz on a fruit, then Shehakol on a drink (unless there was wine).</p>`,

    teach: `
<p><b>A method for any mixture.</b></p>
<ol>
<li><b>Are the parts recognizable and separate?</b> If so, each part may need its own bracha (for example, trail mix or a fruit salad with tree and ground fruits).</li>
<li><b>Is there one of the five grains added for substance?</b> Then it's often Mezonos (Shulchan Aruch 208:2).</li>
<li><b>Otherwise, what's the ikar?</b> The main ingredient, usually the majority or the reason you're eating it.</li>
<li><b>Still unsure?</b> Ask, or make brachos on separate items to cover the doubt the right way. Don't just say Shehakol on everything.</li>
</ol>
<p><b>Common cases.</b></p>
<ul>
<li><b>Vegetable soup:</b> Ha'adama on the vegetables covers the broth, according to many. Broth alone is Shehakol.</li>
<li><b>Breaded schnitzel:</b> the chicken is the ikar and the thin breading is secondary: Shehakol, according to many poskim.</li>
<li><b>Sandwich:</b> Hamotzi covers everything.</li>
<li><b>Fruit salad with apples and melon:</b> Ha'etz on an apple and Ha'adama on the melon, in order.</li>
<li><b>Sushi, pizza, wraps, cholent, granola:</b> poskim discuss each of these. Ask Zalmy for the practice at Mayanot, and write the answers in your notebook.</li>
</ul>
<p><b>The goal</b> is not to memorize every food. It's to know the method, and when to ask.</p>`,

    id: "m3-8", title: "Drinks, and when to make a new bracha", minutes: 5, intro: false,
    teach: `
<p><b>Drinks.</b></p>
<ul>
<li>Water, coffee, tea, soda, juice (except grape), milk, beer: <b>Shehakol</b>.</li>
<li>Wine and grape juice: <b>Hagafen</b>.</li>
<li>Water is only a bracha if you drink it because you're thirsty (or enjoy it). Water to swallow a pill doesn't need one (Shulchan Aruch 204:7).</li>
</ul>
<p><b>Bracha acharona on drinks.</b> It requires a revi'is drunk without a long pause. Hot coffee sipped slowly often doesn't reach that, so many don't say borei nefashos after it. Ask Zalmy for the practice.</p>
<p><b>When does a bracha "run out"?</b> Your bracha covers what you eat in one sitting, as long as you intended to continue. A new bracha is needed if:</p>
<ul>
<li><b>Hesech hada'as:</b> you decided you were done (like after saying a bracha acharona) and then want more.</li>
<li><b>Shinui makom:</b> you change location, in many cases. For example, you make a bracha inside and continue eating outside. Rules differ for bread-meals versus snacks (Shulchan Aruch 178).</li>
<li>A long time passes.</li>
</ul>
<p><b>Planning ahead.</b> When you make a bracha, have in mind everything of that type you might eat now. That avoids doubts later.</p>
<p><b>Wine covers drinks.</b> Hagafen covers other drinks at the same sitting, if they were there or in mind (Shulchan Aruch 174).</p>`,

    id: "m3-9", title: "Kvias seudah and pas haba'ah b'kisnin", minutes: 5, intro: false,
    teach: `
<p><b>Pas haba'ah b'kisnin.</b> Baked grain products that people eat as snacks rather than as bread. The Shulchan Aruch (168:7) describes three types:</p>
<ul>
<li><b>Filled dough:</b> pies, rugelach.</li>
<li><b>Dough kneaded with juice, oil, sugar, or honey</b> so that it tastes distinctly sweet: cake.</li>
<li><b>Crisp, dry baked goods:</b> crackers, pretzels.</li>
</ul>
<p>Eaten as a snack, they're Mezonos with al hamichya after.</p>
<p><b>Kvias seudah.</b> If you eat enough of them to make a meal (<i>kovei'a seudah</i>), they're treated like bread: wash, Hamotzi, and Birkas Hamazon (Shulchan Aruch 168:6). How much counts as a meal is debated. Many say about the volume of four eggs. Ask Zalmy for the Chabad measure.</p>
<p><b>Relevant in Israel: "mezonos rolls".</b> In Israel you'll see rolls and "mezonos bread" (<i>lechem mezonos</i>) kneaded with fruit juice instead of water, sold as Mezonos. Many Sephardi poskim permit Mezonos on these. <span class="diff">Ashkenazi poskim, and Chabad practice, generally treat these as bread: Hamotzi and Birkas Hamazon, especially when eaten as a meal.</span> Ask Zalmy.</p>
<p><b>Pizza and wraps.</b> Poskim debate whether pizza dough is ever Mezonos. Wraps and tortillas are usually treated as bread. Ask.</p>`,

  {
    id: "m3-10", title: "Brachos on smells and sights", minutes: 5, intro: false,
    teach: `
<p><b>Smells (birchos hareiach).</b></p>
<ul>
<li><b>Borei atzei vesamim:</b> fragrant woods and trees (e.g., myrtle, and many flowers growing on woody plants).</li>
<li><b>Borei isvei vesamim:</b> fragrant herbs and grasses (e.g., mint).</li>
<li><b>Borei minei vesamim:</b> other or mixed spices (e.g., cloves according to some, and spice mixtures). Many use it at Havdalah.</li>
<li><b>Hanosen reiach tov baperos:</b> fragrant fruit (e.g., an esrog or a fresh lemon when you smell it).</li>
</ul>
<p><b>Sights and sounds (birchos hare'iyah).</b></p>
<ul>
<li><b>Lightning:</b> <i>oseh maaseh vereishis</i>.</li>
<li><b>Thunder:</b> <i>shekocho ugvuraso malei olam</i>.</li>
<li><b>A rainbow:</b> <i>zocher habris...</i>. Don't stare at it.</li>
<li><b>An ocean you haven't seen in 30 days:</b> <i>oseh es hayam hagadol</i>. Poskim discuss which seas qualify, and the Mediterranean is debated. Ask.</li>
<li><b>Fruit trees in blossom in Nissan:</b> Birkas HaIlanos, once a year.</li>
</ul>
<p><b>Shehecheyanu.</b> Said on a fruit you haven't eaten this season, on a new major garment, and on joyous occasions.</p>
<p><b>Asher yatzar</b> after the bathroom: a bracha on the body's functioning.</p>
<p><b>The point.</b> Brachos make you notice. The Gemara says a person should say 100 brachos a day (Menachos 43b). Chassidus adds: every bracha is a moment of recognizing that Hashem is in this.</p>`,

    teach: `
<p><b>The Torah source.</b> "Do not cook a kid in its mother's milk" appears three times (Shemos 23:19, 34:26; Devarim 14:21). The Gemara (Chullin 115b) derives three prohibitions: cooking meat and milk together, eating the mixture, and benefiting from it. Poultry with milk is rabbinic, but just as binding.</p>
<p><b>Waiting.</b></p>
<ul>
<li><b>After meat before dairy:</b> Chabad waits <b>six hours</b>, following the Rambam and the Shulchan Aruch (Yoreh De'ah 89:1). <span class="diff">Difference: some Ashkenazi communities wait three hours, and Dutch Jews wait one.</span></li>
<li><b>After dairy before meat:</b> rinse your mouth, eat something pareve, and wash your hands. Then meat is permitted.</li>
<li><b>Hard aged cheese:</b> many wait six hours after it before meat. Ask Zalmy what Chabad practice is for the cheeses you eat.</li>
</ul>
<p><b>Separation in the kitchen.</b> Separate dishes, pots, and utensils for meat and dairy; many also keep separate sinks or basins, sponges, and towels. Pareve items cooked in a meat pot take on meat status in some ways (<i>nat bar nat</i>). The rules are detailed.</p>
<p><b>Meat and fish.</b> They aren't eaten together, for health reasons cited in the Gemara (Pesachim 76b). In between, rinse your mouth and eat or drink something.</p>
<p><b>Mistakes.</b> If a dairy spoon went into a meat pot, <b>ask a rav</b> before using the pot or the food. The answer depends on temperature, amounts, and timing, and often nothing is lost.</p>`,

<p><b>The law.</b> The Sages decreed that milk milked by a non-Jew without a Jew watching is forbidden (Avodah Zarah 35b), out of concern that milk from a non-kosher animal was mixed in. Milk supervised by a Jew is <i>chalav Yisrael</i>.</p>
<p><b>The leniency.</b> Some poskim, most famously Rav Moshe Feinstein (Igros Moshe), permitted government-regulated milk (<i>chalav hacompanies</i>): since the law prevents mixing in non-kosher milk, the concern is addressed. Many observant Jews in America rely on this.</p>
<p><b>Chabad practice.</b> Chabad is careful to use only chalav Yisrael. The Rebbe strongly encouraged this for everyone, including where others are lenient. He emphasized that food affects the soul, and that chalav Yisrael is part of a Jew's spiritual sensitivity. He spoke about this especially for children.</p>
<p><b>In Israel.</b> Most dairy is produced under Jewish supervision, but check the hechsher. Imported products and certain powdered-milk ingredients (<i>avkat chalav</i>) can raise questions.</p>

<p>Food that's eaten raw (most fruit) or isn't "important" (like potato chips, according to many) isn't included.</p>
<p><b>What counts as Jewish participation.</b></p>
<ul>
<li><b>Ashkenazi practice</b>, following the Rema: a Jew lighting the fire (or even the pilot light) is enough.</li>
<li><b>Sephardi practice</b>, following the Mechaber: a Jew must place the food on the fire or take part in the cooking itself.</li>

    id: "m5-5", title: "Hechsherim in Israel", minutes: 5, intro: false,
    teach: `
<p><b>Levels.</b></p>
<ul>
<li><b>Rabbanut (local rabbinate):</b> the baseline, government-supervised hechsher. It certifies the basics, but may rely on leniencies that many observant Jews avoid, such as the heter mechira during shmitta, or lower standards for produce checking and meat.</li>
<li><b>Rabbanut mehadrin:</b> a stricter level from the rabbinate.</li>
<li><b>Private mehadrin hechsherim:</b> for example the Badatz of the Eida Chareidis, and the hechsherim of well-known rabbanim in Bnei Brak and elsewhere. There are also Chabad-run hechsherim.</li>
</ul>
<p><b>What differs.</b></p>
<ul>
<li>Shmitta produce.</li>
<li>Terumos and maasros.</li>
<li>Checking produce for insects (a real issue in Israel: many leafy greens need checking, or are grown under insect-control methods).</li>
<li>Meat standards (e.g., glatt, or "chalak Beis Yosef").</li>
<li>Chalav Yisrael, pas Yisrael, and bishul Yisrael.</li>
</ul>
<p><b>Chabad practice.</b> Most Chabad chassidim eat only mehadrin-level hechsherim. <b>Ask Zalmy which hechsherim Mayanot relies on</b> and write them in your notebook. That's more reliable than any list, since hechsherim change.</p>
<p><b>Restaurants.</b> Check that the certificate is current (it has a date) and matches the location. "Kosher-style" or "no pork" means nothing.</p>
<p><b>Bugs.</b> Eating an insect violates several Torah prohibitions. Leafy vegetables, herbs, strawberries, and some grains need checking or a trusted bug-free brand.</p>`,

    id: "m5-6", title: "Terumos and maasros", minutes: 5, intro: false,
    teach: `
<p><b>The mitzvah.</b> Produce grown in Eretz Yisrael can't be eaten until tithes are separated. Before that it's <i>tevel</i>, which is forbidden.</p>
<p><b>What's separated</b> (in order):</p>
<ol>
<li><b>Terumah gedolah:</b> today, a small amount, customarily a little more than 1/100. It's holy and given to a kohen in Temple times; today it's wrapped and disposed of respectfully.</li>
<li><b>Maaser rishon:</b> 1/10 of what's left, for a Levi.</li>
<li><b>Terumas maaser:</b> 1/10 of the maaser rishon. It has the holiness of terumah and is also disposed of.</li>
<li><b>Maaser sheni or maaser ani:</b> 1/10 of the remainder. In years 1, 2, 4, and 5 of the shmitta cycle it's maaser sheni, which is redeemed on a coin. In years 3 and 6 it's maaser ani, for the poor.</li>
</ol>
<p><b>This year.</b> 5787 is the <b>fifth year</b> of the shmitta cycle (the last shmitta was 5782), so it's a maaser sheni year for most produce. Which year a crop belongs to depends on when it grew, so the details get technical.</p>
<p><b>Practically.</b></p>
<ul>
<li>Produce with a reliable hechsher has already been tithed.</li>
<li>Produce from a market without a hechsher, from a friend's tree, or from a field needs separation. There's a formula, printed in many siddurim and available from Israeli rabbinical sources. Ask Zalmy for the text used in Chabad.</li>
<li>For produce that's probably already tithed (<i>demai</i>), you separate without a bracha.</li>
</ul>
<p><b>Hafrashas challah.</b> The same idea applies to dough everywhere, not just in Israel.</p>`,

  {
    id: "m5-7", title: "Shmitta and orlah", minutes: 5, intro: false,
    teach: `
<p><b>Shmitta.</b> Every seventh year the land of Israel rests (Vayikra 25). Fields aren't worked, and produce that grows has <i>kedushas shvi'is</i>: it's ownerless, may not be sold in the usual way, must not be wasted, and has further rules. The last shmitta was 5782; the next is <b>5789</b> (starting fall 2028). You're not here for it this year, but you should know it.</p>
<p><b>The heter mechira.</b> A controversial arrangement that sells Israel's land to a non-Jew for the shmitta year so it can be farmed normally. Many poskim reject it. Mehadrin hechsherim avoid it, and many chareidi communities, including Chabad in general, don't rely on it. Ask Zalmy.</p>
<p><b>Orlah.</b> Fruit from a tree's first three years is forbidden to eat or benefit from (Vayikra 19:23). In the fourth year it's <i>neta revai</i>, which is redeemed.</p>
<ul>
<li><b>In Israel:</b> orlah applies, and even doubtful orlah is forbidden.</li>
<li><b>Outside Israel:</b> it also applies (halacha l'Moshe miSinai), but only definite orlah is forbidden.</li>
</ul>
<p>This is part of why hechsherim check produce sources.</p>
<p><b>Kilayim.</b> Mixing species (grafting trees, planting certain seeds together) is also forbidden. It's relevant if you ever garden.</p>
<p><b>The idea.</b> The land belongs to Hashem. Shmitta is the agricultural Shabbos, and orlah teaches patience and first-fruits thinking.</p>`,

  {
    id: "m9-1", title: "What Chitas and Rambam are", minutes: 5, intro: true,
    teach: `
<p><b>Chitas</b> (Chumash, Tehillim, Tanya) is the set of daily shiurim instituted by the Frierdiker Rebbe. The daily divisions are printed in <i>Hayom Yom</i>.</p>
<ul>
<li><b>Chumash with Rashi:</b> each day of the week, one aliyah of the weekly parsha. Sunday is the first aliyah, and Shabbos is the seventh. By Shabbos you've learned the whole parsha.</li>
<li><b>Tehillim:</b> the book is divided by the day of the month, so you finish all 150 chapters every month. In a 29-day month, you add day 30's portion on day 29. Chabad says it after Shacharis.</li>
<li><b>Tanya:</b> a short portion each day, so the whole Tanya is completed every year.</li>
</ul>
<p><b>Why.</b> The Frierdiker Rebbe taught that these daily shiurim protect a person and his household, and connect him to the Rebbe and to all chassidim learning the same portion that day. It's steady, daily, and small: that's the point.</p>
<p><b>Daily Rambam.</b> On Acharon shel Pesach 5744 (1984), the Rebbe called on every Jew to learn the Rambam's Mishneh Torah daily, which covers all of halacha. There are three tracks:</p>
<ul>
<li><b>3 chapters a day:</b> the whole Rambam in about a year.</li>
<li><b>1 chapter a day:</b> about three years.</li>
<li><b>Sefer HaMitzvos:</b> the Rambam's list of the 613 mitzvos, in parallel with the 1-chapter track. Meant for anyone, including those who find a chapter too much.</li>
</ul>
<p>The Rebbe stressed the unity of Jews worldwide learning the same material, and knowing all of Torah's laws.</p>
<p><b>Hayom Yom</b> itself is also read daily. It was compiled by the Rebbe in 1943 at the Frierdiker Rebbe's request: one short teaching or custom per day.</p>`,

  {
    id: "m9-2", title: "Stage 1: Tanya and Tehillim", minutes: 5, intro: false,
    teach: `
<p><b>Your time.</b> You said you have about 10 minutes at night. The app lesson takes 5. That leaves about 5 minutes, and Stage 1 fits into it.</p>
<p><b>Stage 1.</b></p>
<ul>
<li><b>Tanya, today's portion.</b> It's usually a short paragraph, a few minutes. Read it in Hebrew if you can, with a translation or a short explanation (chabad.org has both). Don't try to master it; aim for contact.</li>
<li><b>Tehillim, today's portion.</b> Chabad custom is after Shacharis, and that's the ideal. If your morning schedule doesn't allow it, say it at a steady time. It takes about 5 to 10 minutes; you can split it through the day.</li>
</ul>
<p><b>How to make it stick.</b></p>
<ul>
<li><b>Tie it to something fixed.</b> Tehillim right after Aleinu of Shacharis; Tanya right before or after the app lesson.</li>
<li><b>Log it in the Tracker.</b> Streaks work.</li>
<li><b>Minimum rule:</b> if a day is chaotic, one line of Tanya and one chapter of Tehillim still counts as not skipping. "Lechatchila ariber": never zero.</li>
</ul>
<p><b>When to move to Stage 2.</b> After about three weeks of steady daily Tanya and Tehillim, add Chumash.</p>`,

  {
    id: "m9-3", title: "Stage 2: Chumash with Rashi", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> The day's aliyah of the parsha, with Rashi's commentary. Rashi (Rabbi Shlomo Yitzchaki, 1040 to 1105) explains the plain meaning of the text, drawing on the Midrash where it helps.</p>
<p><b>Why Rashi.</b> The Rebbe taught that Rashi on Chumash is written so that even a five-year-old can understand the plain meaning, and that it also contains "the wine of Torah", meaning deep secrets. For years the Rebbe gave detailed talks on Rashi's commentary, showing how every word answers a question.</p>
<p><b>How to learn it.</b></p>
<ol>
<li>Read the verse in Hebrew.</li>
<li>Ask yourself what's unclear or surprising about it.</li>
<li>Read Rashi and see what question he's answering.</li>
</ol>
<p>That's the Rebbe's approach. If your Hebrew slows you down, use a translation (chabad.org or a Kehot Chumash) side by side.</p>
<p><b>Time.</b> An aliyah with Rashi takes about 10 to 15 minutes. That's more than your nightly window, so it may need a slot in the day, like right after davening or during a break. Plan it realistically.</p>
<p><b>Shnayim mikra.</b> Separately from Chitas, there's the halacha of reading the parsha twice plus Targum each week (lesson m4-14). Many combine them.</p>`,
    terms: [
      { t: "Rashi", h: "רש״י", m: "Rabbi Shlomo Yitzchaki, the classic commentator" },

      { id: "m9-3-q2", t: "recall", q: "What's the Rebbe's approach to learning a Rashi?", model: "Identify what's difficult in the verse, then see what question Rashi is answering with each word.", x: "Every Rashi is an answer." },
      { id: "m9-3-q3", t: "mc", q: "How long does an aliyah with Rashi take, roughly?", o: ["10 to 15 minutes", "1 minute", "An hour", "A whole day"], a: 0, x: "Plan a real slot for it." },

    ],

  },
  {
    id: "m9-4", title: "Stage 3: Rambam or Sefer HaMitzvos", minutes: 5, intro: false,
    teach: `
<p><b>Choosing a track.</b></p>
<ul>
<li><b>Sefer HaMitzvos:</b> a few minutes a day. You'll learn what each of the 613 mitzvos is. It's the most realistic start for you.</li>
<li><b>1 chapter a day:</b> 10 to 15 minutes. A real grasp of halacha across all topics over about three years.</li>
<li><b>3 chapters a day:</b> 30 to 45 minutes. The full cycle in a year, alongside the worldwide siyum.</li>
</ul>
<p><b>Start where you'll finish.</b> The Rebbe offered Sefer HaMitzvos exactly for people who couldn't do a chapter. It's the same cycle, and the same unity.</p>
<p><b>What you get.</b> The Rambam's code covers everything:</p>
<ul>
<li>Beliefs: Hilchos Yesodei HaTorah, the first section.</li>
<li>Character: Hilchos Deos, including his health guidance.</li>
<li>Business: Hilchos Mechirah and others.</li>
<li>The Beis HaMikdash, Moshiach, and more.</li>
</ul>
<p>Over time, you'll have seen every area of Torah law.</p>
<p><b>Your full plan.</b></p>
<ol>
<li><b>Stage 1:</b> Tanya and Tehillim (now).</li>
<li><b>Stage 2:</b> add Chumash (in about three weeks).</li>
<li><b>Stage 3:</b> add Sefer HaMitzvos, and later one chapter.</li>
</ol>
<p>Ask Zalmy which Rambam track Mayanot bochurim usually do, and whether there's a shiur you can join.</p>`,

      { id: "m9-4-q2", t: "mc", q: "The Rambam's first section is:", o: ["Hilchos Yesodei HaTorah", "Hilchos Shabbos", "Hilchos Melachim", "Hilchos Deos"], a: 0, x: "The foundations of belief." },

  <script>
/* Module 2: Daily Routine and Davening */
CP_LESSONS("m2", [
  {
    id: "m2-1", title: "Modeh Ani and negel vasser", minutes: 5, intro: true,
    teach: `
<p><b>Modeh Ani.</b> The first words of the day, said the moment you wake up, even before washing: "Modeh ani lefanecha, Melech chai v'kayam, shehechezarta bi nishmasi b'chemla, rabbah emunasecha." (I thank You, living and eternal King, for returning my soul to me with compassion; great is Your faithfulness.) It contains no name of Hashem, so it may be said before washing.</p>
<p><b>Why first.</b> The Frierdiker Rebbe (Hayom Yom) explains that Modeh Ani comes before any understanding: it's a thank-you from the essence of the soul, even before the mind wakes up. It sets the day's tone as kabbalas ol, accepting Hashem, before anything else.</p>
<p><b>Negel vasser</b> (Yiddish: "nail water"). On waking, you wash your hands from a cup: <b>right, left, right, left, right, left</b>, three times each, alternating. Chabad keeps a cup and basin next to the bed so you wash before walking four amos. The reasons (Shulchan Aruch, Orach Chaim 4):</p>
<ul>
<li>To remove the <i>ruach ra'ah</i> (impurity) that rests on the hands after sleep.</li>
<li>To prepare for davening, like a kohen washing before his service.</li>
</ul>
<p>Don't touch your eyes, mouth, or food before washing.</p>
<p><b>The bracha.</b> The bracha <i>al netilas yadayim</i> is part of the morning brachos. The common Chabad practice is to say it after using the washroom and washing again, together with asher yatzar. Ask Zalmy to show you the order in the Siddur.</p>`,
    terms: [
      { t: "Modeh Ani", h: "מודה אני", m: "\"I thank\": the first words on waking" },
      { t: "Negel vasser", h: "נעגל וואסער", m: "Yiddish: the morning hand-washing" },
      { t: "Ruach ra'ah", h: "רוח רעה", m: "Spiritual impurity resting on the hands after sleep" },
      { t: "Kabbalas ol", h: "קבלת עול", m: "Accepting the yoke of Heaven" },

    id: "m2-2", title: "Tefillin: Chabad details", minutes: 5, intro: false,
    teach: `
<p><b>The mitzvah.</b> "Bind them as a sign on your arm, and as totafos between your eyes" (Devarim 6:8). The shel yad goes on the arm, facing the heart; the shel rosh on the head, above the hairline. Together they bind your mind and heart to Hashem.</p>
<p><b>Order.</b></p>
<ol>
<li>Tallis first.</li>
<li>Then the shel yad on the <b>weaker</b> arm (the left for a righty), on the biceps muscle, tilted toward the heart.</li>
<li>Say the bracha, tighten, and wrap seven times around the forearm.</li>
<li>Then put on the shel rosh without speaking in between.</li>
<li>Then finish the wraps on the hand.</li>
</ol>
<p><b>Chabad specifics.</b></p>
<ul>
<li><b>One bracha</b>, <i>l'haniach tefillin</i>, on the shel yad, covering both. <span class="diff">Difference: Ashkenazim who follow the Rema say a second bracha, "al mitzvas tefillin", on the shel rosh.</span></li>
<li><b>Wrapping direction:</b> Chabad wraps the strap on the forearm inward, toward the body. <span class="diff">Difference: many Ashkenazim wrap outward.</span></li>
<li><b>Knot and script:</b> Chabad tefillin have a specific knot, and are written in <i>Ksav Admor HaZaken</i>, the Alter Rebbe's script.</li>
<li><b>Covering:</b> the shel yad is covered by your sleeve.</li>
</ul>
<p><b>Checking.</b> Tefillin should be checked by a sofer periodically. Chabad practice is at least once a year, commonly in Elul, and immediately if they get wet or damaged. Keep the straps black side out.</p>
<p><b>Mivtza tefillin.</b> The Rebbe launched the tefillin campaign in 1967, right before the Six Day War, citing the Gemara that tefillin inspire fear in enemies (Menachos 35b, on Devarim 28:10).</p>`,

    id: "m2-3", title: "Rabbeinu Tam tefillin", minutes: 5, intro: false,
    teach: `
<p><b>The dispute.</b> Tefillin contain four Torah passages (parshiyos): Kadesh, V'haya ki yeviacha, Shema, and V'haya im shamoa. Rashi and his grandson Rabbeinu Tam disagree about the order they're placed in:</p>
<ul>
<li><b>Rashi:</b> in Torah order, so the last two are Shema, then V'haya im shamoa.</li>
<li><b>Rabbeinu Tam:</b> switches the last two, so V'haya im shamoa comes before Shema.</li>
</ul>
<p>The halacha follows Rashi, and that's the tefillin you wear with the bracha.</p>
<p><b>Why wear both.</b> The Shulchan Aruch (34:2) says that a person known for piety should also put on Rabbeinu Tam tefillin, to fulfill both opinions. The Arizal explains that both are true in Kabbalistic terms, corresponding to different spiritual levels.</p>
<p><b>Chabad practice.</b> Chabad chassidim wear Rabbeinu Tam tefillin every weekday from bar mitzvah, after Rashi tefillin, toward the end of Shacharis, without a bracha. While wearing them, it's customary to say Shema and the passages of Kadesh and V'haya ki yeviacha. The Rebbe encouraged every bochur to wear them.</p>
<p><b>If you don't have them yet.</b> This is a good conversation for Zalmy. Rabbeinu Tam tefillin are a real expense, and Mayanot may have a pair to lend while you arrange your own.</p>`,

    id: "m2-4", title: "Birchos HaShachar", minutes: 5, intro: false,
    teach: `
<p><b>What they are.</b> A series of brachos thanking Hashem for the basics of waking up (Berachos 60b). Originally, each was said as you experienced it:</p>
<ul>
<li>Opening your eyes: <i>pokei'ach ivrim</i>.</li>
<li>Standing up: <i>zokeif kefufim</i>.</li>
<li>Getting dressed: <i>malbish arumim</i>.</li>
</ul>
<p>Today we say them together at the start of davening.</p>
<p><b>What's included.</b></p>
<ul>
<li><b>Al netilas yadayim</b> and <b>asher yatzar</b>.</li>
<li><b>Elokai neshama:</b> the soul Hashem gave you is pure.</li>
<li><b>Birchos HaTorah:</b> the brachos on learning Torah. These must be said before any Torah learning in the morning, even thinking in words of Torah.</li>
<li>The series of morning thanks, including the three identity brachos: "shelo asani goy", "shelo asani aved", "shelo asani isha".</li>
</ul>
<p><b>Chabad.</b> In the Alter Rebbe's siddur they follow a specific order. Bochurim at Mayanot typically say them in shul, or before coming, and answer amen to each other. Answering amen to someone else's Birchos HaShachar is a practice many encourage.</p>
<p><b>Tallis katan.</b> The bracha on tzitzis is said when you put on the tallis katan. Chabad custom is to say it when putting on the tallis gadol and have the tallis katan in mind, for those who wear one. Ask Zalmy for the details.</p>`,

    id: "m2-5", title: "Karbanos", minutes: 5, intro: false,
    teach: `
<p><b>"Hareini mekabel."</b> Chabad begins Shacharis with: "Hareini mekabel alai mitzvas asei shel v'ahavta l'reiacha kamocha": I accept upon myself the mitzvah of loving your fellow as yourself. This follows the Arizal. You start davening by joining yourself to every Jew.</p>
<p><b>Tzedakah.</b> Chabad custom is to give tzedakah before Shacharis on weekdays, following Rabbi Elazar, who gave a coin to a poor person and then davened (Bava Basra 10a).</p>
<p><b>Karbanos.</b> Passages about the Temple offerings:</p>
<ul>
<li><b>The Tamid:</b> the daily offering.</li>
<li><b>The Ketores:</b> the incense.</li>
<li><b>Eizehu mekoman:</b> the Mishnah on where each korban was offered.</li>
<li><b>Rabbi Yishmael's 13 principles</b> of interpreting Torah.</li>
</ul>
<p>Why? The Gemara (Menachos 110a) says that one who studies the laws of the offerings is considered as if he brought them. Our tefillos were established in place of the korbanos (Berachos 26b).</p>
<p><b>The Chassidic idea.</b> <i>Korban</i> comes from <i>karov</i>, closeness. The real korban is the animal soul: bringing your drives and energy close to Hashem. That's the Alter Rebbe's reading of "adam ki yakriv mikem korban" (Vayikra 1:2): a person who brings himself close offers "from you", from within.</p>
<p><b>Time.</b> If you're short on time, there are parts you can skip and parts you must not. Ask Zalmy for the priorities.</p>`,

    id: "m2-6", title: "Pesukei D'zimra", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> "Verses of praise": the section from Hodu and Baruch She'amar through Yishtabach. The Gemara teaches that a person should first praise Hashem and then pray for his needs (Berachos 32a). Pesukei D'zimra is that praise.</p>
<p><b>The structure.</b></p>
<ol>
<li><b>Hodu:</b> from Divrei HaYamim, the song when the Aron was brought to Yerushalayim. <span class="diff">In Nusach Ari (Chabad) and Nusach Sefard, Hodu comes before Baruch She'amar. In Nusach Ashkenaz it comes after.</span></li>
<li><b>Baruch She'amar:</b> the opening bracha.</li>
<li><b>Ashrei</b> (Tehillim 145) and the five "Halleluyah" chapters (Tehillim 146 to 150).</li>
<li><b>Vayevarech David</b>, and <b>Az Yashir</b>, the Song at the Sea.</li>
<li><b>Yishtabach:</b> the closing bracha.</li>
</ol>
<p><b>No talking</b> from Baruch She'amar until after the Amidah, apart from certain responses. This section is a unit.</p>
<p><b>Ashrei.</b> The Gemara says one who says Tehillim 145 three times daily is assured of the World to Come (Berachos 4b), because it's an alphabetical praise that includes "poseach es yadecha", Hashem providing for all. Concentrate on that verse. The Shulchan Aruch (51:7) says that if you didn't concentrate on it, you should repeat it.</p>
<p><b>Why praise first.</b> Chassidus explains that praise builds awareness of Hashem's greatness. That's the hisbonenus that makes the Shema and the Amidah real.</p>`,

      { id: "m2-6-q2", t: "mc", q: "In Nusach Ari, Hodu is said:", o: ["Before Baruch She'amar", "After Baruch She'amar", "At Mincha only", "Not at all"], a: 0, x: "Ashkenaz has it after." },
      { id: "m2-6-q3", t: "tf", q: "You may chat between Baruch She'amar and Yishtabach if it's brief.", a: false, x: "False. No talking in Pesukei D'zimra." },

  {
    id: "m2-7", title: "Shema and its brachos", minutes: 5, intro: false,
    teach: `
<p><b>Barchu</b> is the call to prayer with a minyan. After it come the brachos of Shema.</p>
<p><b>Before Shema (two brachos).</b></p>
<ul>
<li><b>Yotzer Or:</b> Hashem renews creation daily. It includes the angels' praise, "Kadosh, kadosh, kadosh".</li>
<li><b>Ahavah Rabbah:</b> Hashem's love for Israel, shown in giving the Torah. We ask to understand it.</li>
</ul>
<p><b>Shema (three paragraphs).</b></p>
<ul>
<li><b>Shema Yisrael and V'ahavta:</b> accepting Hashem's kingship (kabbalas ol malchus shamayim) and loving Him.</li>
<li><b>V'haya im shamoa:</b> accepting the mitzvos.</li>
<li><b>Vayomer:</b> tzitzis, and remembering the Exodus.</li>
</ul>
<p>Cover your eyes with your right hand for the first verse. Say "Baruch shem kevod malchuso l'olam va'ed" quietly.</p>
<p><b>After Shema.</b> <b>Emes v'yatziv</b>, ending with "Ga'al Yisrael". There's no interruption between "Ga'al Yisrael" and the Amidah (<i>semichas geulah l'tefillah</i>).</p>

<p><b>The Chassidus.</b> "Hashem echad": not just that there's one G-d, but that nothing exists apart from Him. That's the hisbonenus of Shema.</p>`,

    id: "m2-8", title: "Shemoneh Esrei", minutes: 5, intro: false,
    teach: `
<p><b>The core of davening.</b> The Amidah (standing prayer) was composed by the Men of the Great Assembly. Originally it had 18 brachos, hence "Shemoneh Esrei"; a 19th, against heretics and informers, was added later (Berachos 28b).</p>
<p><b>The structure.</b></p>
<ul>
<li><b>3 of praise:</b> Avos, Gevuros, Kedushas Hashem.</li>
<li><b>13 of requests:</b> understanding, teshuvah, forgiveness, redemption, healing, prosperity (Barech Aleinu), gathering of exiles, justice, against heretics, for the righteous, rebuilding Yerushalayim, Moshiach, and accepting our prayer.</li>
<li><b>3 of thanks:</b> Retzeh, Modim, and Sim Shalom.</li>
</ul>
<p><b>How to stand.</b></p>
<ul>
<li>Feet together, like angels.</li>
<li>Face toward Yerushalayim. In Jerusalem that means toward the Beis HaMikdash.</li>
<li>Take three steps forward before you start, and three steps back at the end.</li>
<li>Bow at the beginning and end of Avos and Modim.</li>
<li>Say it quietly, but move your lips so you hear yourself.</li>
</ul>
<p><b>Additions.</b> Mashiv haruach (winter), v'sein tal umatar (the rainy season), ya'aleh v'yavo (Rosh Chodesh and festivals), al hanissim (Chanukah and Purim). Know what to do if you forget one: some you go back for, and some you don't. Check a halacha summary or ask.</p>
<p><b>Personal requests.</b> You can add your own words in the relevant bracha. For example, in Barech Aleinu, ask for the business's success in your own words.</p>`,

    teach: `
<p><b>Tachanun.</b> After the Amidah on most weekdays comes <i>nefilas apayim</i>: resting your head on your arm while saying a psalm of Dovid: Tehillim 25 in Nusach Ari (Nusach Ashkenaz uses Tehillim 6). You sit, and rest your head on the arm without tefillin (on your right arm while wearing tefillin on the left). On Monday and Thursday there's a longer Tachanun (V'hu Rachum) and a Torah reading.</p>
<p><b>No Tachanun</b> on: Rosh Chodesh, all of Nissan, Chanukah, Purim, Tu B'Shvat, Lag BaOmer, from Rosh Chodesh Sivan until after Shavuos, Tishah B'Av, Tu B'Av, from Erev Yom Kippur through the end of Tishrei, when a chosson is present, and <b>on Chabad days of redemption</b> such as Yud Tes Kislev and Yud Beis to Yud Gimmel Tammuz. Check a Chabad luach.</p>
<p><b>After Tachanun.</b></p>
<ul>
<li><b>Ashrei</b> again.</li>
<li><b>Uva L'Tzion:</b> Kedusha with translation.</li>
<li><b>Shir shel Yom:</b> the psalm the Levites sang that day of the week.</li>
<li><b>Aleinu:</b> "it is our duty to praise". It was originally composed for Rosh Hashanah, and is now said at the end of every service.</li>
</ul>
<p><b>Chabad after davening.</b> The day's Tehillim (Chitas) is customarily said after Shacharis. Many learn a short portion of Chassidus right after.</p>
<p><b>Kaddish.</b> It's said several times, by the chazzan and by mourners. Answer "Amen, yehei shmei rabbah..." with full concentration. The Gemara (Shabbos 119b) says answering it with all your strength tears up harsh decrees.</p>`,

    id: "m2-10", title: "Mincha and Maariv", minutes: 5, intro: false,
    teach: `
<p><b>Mincha.</b> The afternoon prayer, corresponding to the afternoon Tamid. The Gemara (Berachos 6b) says a person should be especially careful with Mincha, since Eliyahu was answered at Mincha. It interrupts the busy day, which is exactly the point.</p>
<ul>
<li><b>Time:</b> from half an hour after midday (<i>mincha gedolah</i>) until sunset. Chabad calendars follow the Alter Rebbe's times.</li>
<li><b>Structure:</b> Chabad begins with the passage of the Korban Tamid, then Ashrei, half Kaddish, the Amidah (repeated with a minyan), Tachanun on most days, and Aleinu.</li>
</ul>
<p><b>Your business.</b> Mincha in Israel falls in the Bay Area's early morning, when messages start coming in. Guard it: phone face down, and daven first.</p>
<p><b>Maariv.</b> The evening prayer, corresponding to the burning of the parts of the korbanos at night. Its structure:</p>
<ul>
<li>Barchu.</li>
<li>Two brachos before Shema: Hashem brings evening, and Hashem's eternal love.</li>
<li>Shema.</li>
<li>Two brachos after: redemption, and Hashkiveinu, protection at night.</li>
<li>The Amidah (not repeated), then Aleinu.</li>
</ul>
<p>Maariv is said after nightfall. It was originally optional, but it has become obligatory by universal acceptance (Berachos 27b).</p>
<p><b>The three tefillos</b> correspond to the Avos (Berachos 26b): Avraham, Shacharis; Yitzchak, Mincha; Yaakov, Maariv.</p>`,

    id: "m2-11", title: "Kriyas Shema al HaMitah and hisbonenus", minutes: 5, intro: false,
    teach: `
<p><b>Kriyas Shema al HaMitah</b> ("Shema at bedtime"). It contains:</p>
<ul>
<li><b>Forgiveness:</b> "Ribono shel olam, hareini mochel...": forgiving anyone who wronged you that day.</li>
<li><b>The first paragraph of Shema</b>, and other passages.</li>
<li><b>Hamapil:</b> the bracha on sleep.</li>
</ul>
<p>Chabad sources recommend a short nightly cheshbon hanefesh at this time: review the day honestly, regret what went wrong, and resolve to do better. Then let it go and sleep in peace.</p>
<p><b>Hisbonenus: davening with the mind.</b> Chabad's distinct approach to davening. Before and during prayer, you contemplate a Chassidic concept until it moves you. For example, "Hashem creates the world anew each moment" (Shaar HaYichud VehaEmunah ch. 1). The Rebbe Rashab's <i>Kuntres HaTefillah</i> explains how. "Avodah shebalev" (service of the heart, Taanis 2a) is reached through the mind.</p>
<p><b>How to start.</b></p>
<ol>
<li>Before Shacharis, take 2 minutes. Pick one idea from Tanya or a maamar you learned.</li>
<li>Think it through in detail (Binah), then connect it to yourself (Daas).</li>
<li>Then daven with that in mind, especially Pesukei D'zimra and Shema.</li>
</ol>
<p><b>Davening b'arichus.</b> On Shabbos especially, chassidim daven slowly and at length. It's not about length for its own sake; the time is filled with contemplation.</p>
<p><b>Be honest.</b> Most people don't feel much most days. The avodah is showing up and thinking anyway. Ask Zalmy or a mashpia for a hisbonenus to start with.</p>`,

<p><b>Why it matters to you.</b> You're a student in a yeshiva that exists because of the Rebbe Rashab's vision. He founded Tomchei Temimim in 1897 to produce bochurim who combine serious Gemara with serious Chassidus and avodah, and who carry responsibility for the Jewish people. Chof Cheshvan is traditionally a day when yeshiva students take stock of how seriously they're taking that.</p>

    id: "m7-2", title: "Yud Tes Kislev", minutes: 5, intro: false,
    teach: `
<p><b>What happened.</b> In 1798, opponents of Chassidus informed on the Alter Rebbe to the Czar's government, accusing him of treason. He was arrested and held in St. Petersburg. Chassidic tradition explains the arrest as reflecting a heavenly accusation against spreading Chassidus so widely. His release on 19 Kislev (5559) was the verdict that Chassidus should spread even more.</p>
<p><b>After the release.</b> The Alter Rebbe wrote a letter (Iggeres HaKodesh, letter 2) urging his chassidim not to gloat over their opponents, citing "katonti mikol hachasadim", "I have become small from all the kindnesses" (Bereishis 32:11). Kindness from Hashem should make you humbler.</p>
<p><b>Also on 19 Kislev:</b> the yahrzeit of the Maggid of Mezritch (1772), the Alter Rebbe's teacher.</p>
<p><b>The Rosh Hashanah of Chassidus.</b> It's called this because it marks the birth of Chassidus's open, widespread phase. Chassidim greet each other with: "L'shanah tovah b'limud haChassidus uv'darkei haChassidus tikaseivu v'seichaseimu": may you be inscribed for a good year in the study and ways of Chassidus.</p>
<p><b>How it's marked.</b></p>
<ul>
<li>Big farbrengens, often lasting through the night.</li>
<li><i>Chalukas HaShas</i>: dividing the whole Talmud among participants to learn during the year.</li>
<li>Resolutions in learning Chassidus.</li>
<li>No Tachanun.</li>
</ul>`,

    id: "m7-3", title: "Chof Daled Teves", minutes: 5, intro: false,
    teach: `
<p><b>What.</b> 24 Teves is the yahrzeit of the Alter Rebbe (1812).</p>
<p><b>The circumstances.</b> When Napoleon invaded Russia in 1812, the Alter Rebbe opposed him. He held that Napoleon's victory would bring Jews material freedom but spiritual decline. He fled eastward ahead of the French army with his family, in a harsh winter, and passed away on the road in the village of Piena. He is buried in Haditch, Ukraine, which chassidim still visit.</p>
<p><b>His legacy</b> is the entire system you're learning:</p>
<ul>
<li>The Tanya, a practical guide for the average Jew.</li>
<li>The Shulchan Aruch HaRav, the halachic foundation of Chabad.</li>
<li>The Siddur.</li>
<li>Chabad Chassidus itself: the mind leading the heart.</li>
</ul>
<p><b>How it's marked.</b></p>
<ul>
<li>Learning the Alter Rebbe's teachings, especially Tanya and his Shulchan Aruch.</li>
<li>Saying Tehillim and learning Mishnayos whose letters spell his name.</li>
<li>Giving tzedakah.</li>
<li>Farbrengens.</li>
</ul>
<p>Many chassidim finish a section of Tanya or a set of halachos from the Shulchan Aruch HaRav that day.</p>
<p><b>Yahrzeit vs. hilula.</b> The day a tzaddik passes is called a <i>hilula</i> (a celebration, in the language of the Zohar), because all his life's work is revealed and shines on that day. It's marked with seriousness, but also as a day of connection and growth, not only mourning.</p>`,

    id: "m7-4", title: "Yud Shvat", minutes: 5, intro: false,
    teach: `
<p><b>Two events.</b></p>
<ul>
<li><b>10 Shvat 5710 (1950):</b> the Frierdiker Rebbe passed away in New York.</li>
<li><b>10 Shvat 5711 (1951):</b> exactly one year later, at a farbrengen, the Rebbe formally accepted the leadership by saying a maamar.</li>
</ul>
<p><b>Basi L'Gani.</b> For Yud Shvat 1950, the Frierdiker Rebbe had prepared a series of maamarim (discourses) beginning <i>"Basi L'Gani"</i>, "I have come into My garden" (Shir HaShirim 5:1). The Midrash reads this as Hashem returning to His original home in this world: the Shechinah was originally at home in the lower world, withdrew because of sin, and is drawn back down by tzaddikim, from Avraham to Moshe, the seventh. The Rebbe's first maamar built on this: our generation, the seventh from the Alter Rebbe, has the task of completing that return, bringing Moshiach.</p>
<p><b>The yearly cycle.</b> The Frierdiker Rebbe's Basi L'Gani has 20 chapters. Each year on Yud Shvat the Rebbe explained the next chapter in turn, in a 20-year cycle.</p>
<p><b>How it's marked.</b></p>
<ul>
<li>Learning Basi L'Gani.</li>
<li>Farbrengens, often with a focus on shlichus.</li>
<li>Hachlatos to take on a new mission.</li>
<li>Many travel to the Ohel.</li>
</ul>
<p>It's one of the most important days of the Chabad year.</p>`,

<p><b>What.</b> 11 Nissan is the Rebbe's birthday (1902).</p>
<p><b>How it's marked.</b></p>
<ul>
<li><b>The Rebbe's chapter of Tehillim.</b> Chassidim say the chapter matching the Rebbe's new year of life, alongside their own chapter, every day of the year. In 5787 (2027) it's the Rebbe's 125th birthday, so the chapter is 126.</li>
<li><b>Farbrengens</b> and new commitments, especially in the Rebbe's campaigns.</li>
<li><b>Education and Sharing Day, USA.</b> Since 1978, U.S. presidents have proclaimed a national day around the Rebbe's birthday, highlighting education and moral values. That shows the Rebbe's influence beyond the Jewish world.</li>
</ul>
<p><b>The Rebbe on birthdays.</b> The Rebbe taught that on your birthday your mazal is strong, so it's a day for spiritual growth and resolutions. He launched a birthday campaign in 5748 (1988) encouraging every Jew, including children, to mark theirs.</p>
<p><b>Nissan.</b> The date falls in the month of redemption, days before Pesach. The themes connect: personal and national freedom, and Moshiach.</p>`,

    id: "m7-6", title: "Gimmel Tammuz", minutes: 5, intro: false,
    teach: `
<p><b>What.</b> 3 Tammuz 5754 (1994) is the day the Rebbe passed away. He is buried in the Ohel at the Old Montefiore Cemetery in Queens, New York, next to the Frierdiker Rebbe.</p>
<p><b>How it's marked.</b></p>
<ul>
<li><b>Visiting the Ohel.</b> Tens of thousands visit around Gimmel Tammuz, and many throughout the year.</li>
<li><b>Writing a letter</b> (a <i>pan</i>, or <i>tzetl</i>) with your name, your mother's name, and requests or resolutions. It's brought or sent to the Ohel to be read there. The Ohel accepts letters by fax and email too.</li>
<li><b>Learning the Rebbe's teachings.</b></li>
<li><b>Hachlatos:</b> taking on a new mitzvah or strengthening one.</li>
<li><b>Farbrengens.</b></li>
</ul>
<p><b>The connection.</b> Chassidus teaches that a tzaddik's influence continues, and even grows, after his passing (Tanya, Iggeres HaKodesh 27, on the tzaddik's life being spiritual and continuing). Chassidim continue to learn the Rebbe's teachings, follow his directives, and see themselves as his chassidim.</p>
<p><b>Differences you'll encounter.</b> Chabad chassidim speak about Gimmel Tammuz in different ways. Some speak of it as a passing and yahrzeit; others avoid that language. Listen, learn, and discuss it with Zalmy or your mashpia rather than adopting slogans you don't understand.</p>`,

    id: "m7-7", title: "Yud Beis Tammuz", minutes: 5, intro: false,
    teach: `
<p><b>What.</b> 12 Tammuz is both the birthday of the Frierdiker Rebbe (1880) and the day news came of his release from Soviet exile (1927). The official release was on 13 Tammuz.</p>
<p><b>The story.</b> On 15 Sivan 1927 the Frierdiker Rebbe was arrested by the Soviet secret police for spreading Judaism. He was held in Spalerno prison in Leningrad and sentenced to death. After international pressure, the sentence was changed to exile in Kostroma, and then he was freed.</p>
<p><b>His letter.</b> After his release he wrote: "It was not me alone that Hashem redeemed on 12 Tammuz, but all who cherish our holy Torah, keep its mitzvos, and even all who are called by the name Israel." The redemption belongs to every Jew.</p>
<p><b>How it's marked.</b></p>
<ul>
<li>It's called <i>Chag HaGeulah</i>, the Festival of Redemption.</li>
<li>Farbrengens.</li>
<li>No Tachanun.</li>
<li>Resolutions to strengthen Jewish education, which was his life's work: he risked his life for chadarim in the USSR.</li>
</ul>
<p><b>The lesson.</b> In prison he refused to be intimidated: "one G-d and two worlds". Chassidim draw from this day the strength not to be cowed by pressure, whether governments, social pressure, or the voice that says "you can't keep that here".</p>`,

    id: "m7-8", title: "Chof Av", minutes: 5, intro: false,
    teach: `
<p><b>What.</b> 20 Av is the yahrzeit of <b>Rabbi Levi Yitzchak Schneerson</b> (1878 to 1944), the Rebbe's father.</p>
<p><b>Who he was.</b> A great Torah scholar and Kabbalist, and the chief rabbi of Yekaterinoslav (today Dnipro, Ukraine). Under Soviet rule he fought to keep Jewish life going: kosher matzah for Pesach, mikvaos, and marriages according to halacha.</p>
<p><b>Exile.</b> In 1939 he was arrested for his Jewish activity and exiled to a remote village in Kazakhstan, Chi'ili. His wife, Rebbetzin Chana, joined him. There was no ink, so she made ink from herbs she gathered, so he could write his Torah insights. They were later published as <i>Likkutei Levi Yitzchak</i>. He passed away in Almaty in 1944, weakened by the hardships.</p>
<p><b>How it's marked.</b></p>
<ul>
<li>Learning his teachings.</li>
<li>Farbrengens.</li>
<li>Recalling his and Rebbetzin Chana's mesiras nefesh.</li>
</ul>
<p>The Rebbe held farbrengens on Chof Av every year and often explained his father's teachings.</p>
<p><b>Why it matters.</b> The Rebbe's own commitment to every Jew grew in a home where the father risked everything for Jewish life, and the mother made ink out of plants so Torah could be written.</p>`,

<p><b>What.</b> 18 Elul is the birthday of two founders:</p>
<ul>
<li><b>The Baal Shem Tov</b> (1698), founder of Chassidus. Tradition says he also began revealing himself publicly on his 36th birthday, 18 Elul 1734.</li>
<li><b>The Alter Rebbe</b> (1745), founder of Chabad.</li>
</ul>
<p><b>Chai means life.</b> The Frierdiker Rebbe explained that Chai Elul brings <i>chayus</i>, life, into the avodah of Elul. Elul is a month of teshuvah and preparation for Rosh Hashanah, and Chai Elul adds warmth and vitality to it. It marks the final 12 days of the year: each day corresponds to a month of the past year, a chance to repair it.</p>
<p><b>How it's marked.</b></p>
<ul>
<li>Farbrengens.</li>
<li>Resolutions for the coming year.</li>
<li>A deeper cheshbon hanefesh.</li>
</ul>
<p>This is the right time to get your Rosh Hashanah preparation serious.</p>
<p><b>You missed it this year.</b> It was 18 Elul 5786, a few weeks ago. Next year it's the date to use for planning your 5788 goals.</p>`,

    id: "m7-10", title: "How a Chabad date is marked", minutes: 5, intro: false,
    teach: `
<p><b>The general pattern.</b> Most Chabad dates are marked the same way:</p>
<ul>
<li><b>A farbrengen</b>, the central event. There are stories and teachings about that Rebbe or that event, niggunim (especially that Rebbe's niggunim), and l'chaim.</li>
<li><b>Learning</b> the teachings of that Rebbe, or about that event.</li>
<li><b>Hachlatos:</b> concrete resolutions.</li>
<li><b>Tzedakah</b>, often in amounts connected to the date.</li>
<li><b>No Tachanun</b> on days of redemption (geulah).</li>
</ul>
<p><b>Types of days.</b></p>
<ul>
<li><b>Geulah days:</b> releases from prison, like Yud Tes Kislev and Yud Beis Tammuz. Joyous, festival-like.</li>
<li><b>Hilula days:</b> passings. Serious and connected; still with farbrengens and growth.</li>
<li><b>Birthdays:</b> growth and commitment.</li>
<li><b>Other milestones:</b> Yud Shvat (leadership), 28 Sivan (the Rebbe's arrival in America), 15 Elul (the founding of Tomchei Temimim).</li>
</ul>
<p><b>Personal dates.</b> The Rebbe encouraged personal dates too: your birthday, your yahrzeits, and even the date you started keeping something (a "yom tov" of your own).</p>
<p><b>The Chabad luach.</b> A Chabad calendar lists all these dates, the daily zmanim, and the daily Chitas. Get one, or use the chabad.org calendar. The Chabad calendar reference page in this app lists them.</p>
<p><b>Your year.</b> Upcoming this year: Chof Cheshvan, Yud Kislev, Yud Tes Kislev, Chof Daled Teves, Yud Shvat, Chof Beis Shvat, Yud Aleph Nissan, Gimmel Tammuz, Yud Beis Tammuz, Chof Av, Chai Elul.</p>`,

    id: "m8-1", title: "Tanya ch. 1: tzaddik, rasha, beinoni", minutes: 5, intro: false,
    teach: `
<p><b>The opening.</b> Tanya begins with a teaching from the Gemara (Niddah 30b): before a soul is born, it's made to swear: "Be a tzaddik and don't be a rasha. Even if the whole world tells you that you're a tzaddik, consider yourself a rasha."</p>
<p><b>The problems.</b> The Alter Rebbe asks two questions:</p>
<ul>
<li>The Mishnah (Avos 2:13) says "don't be wicked in your own eyes". So how can you be told to consider yourself a rasha?</li>
<li>If a person considers himself a rasha, he'll become depressed and won't serve Hashem with joy.</li>
</ul>
<p>He also cites the Gemara (Berachos 61b): "Beinonim are judged by both" (both inclinations). Rabbah said of himself, "I am a beinoni." Abaye answered, "then the master leaves no life for anyone". If Rabbah, a great sage, was "only" a beinoni, the category clearly doesn't mean half good deeds and half bad.</p>
<p><b>So what is a beinoni?</b> Not someone with half mitzvos and half aveiros. That's a common misunderstanding, and you gave it in the interview. The Alter Rebbe will define the terms carefully by chapter 12. That's why Tanya's formal name is <i>Sefer shel Beinonim</i>, "the book of the intermediates": it's written for the beinoni.</p>
<p><b>The key to everything: two souls.</b> Quoting Rabbi Chaim Vital, the Alter Rebbe explains that every Jew has two souls:</p>
<ul>
<li><b>The animal soul</b> (nefesh habehamis): from kelipas noga, the source of natural drives and traits. It lives in the blood and gives life to the body.</li>
<li><b>The G-dly soul</b> (nefesh Elokis), explained in chapter 2.</li>
</ul>
<p>The animal soul isn't evil in itself. It's natural energy, which can go either way.</p>`,

  {
    id: "m8-2", title: "Tanya ch. 2: the G-dly soul", minutes: 5, intro: false,
    teach: `
<p><b>"A part of G-d above, literally."</b> Chapter 2 opens: the second soul of a Jew is "chelek Eloka mimaal mamash", a part of G-d above, literally (based on Iyov 31:2). The Alter Rebbe adds "mamash", literally, to make clear it isn't a metaphor.</p>
<p><b>The analogy.</b> A child comes from the father's brain (as understood in the Alter Rebbe's time). The child is a separate person, yet his essence is drawn from the father's mind. So too, the soul is drawn from Hashem's "Chochmah": it remains connected to its source even after descending into a body.</p>
<p><b>Every Jew.</b> Even the soul of the simplest Jew is rooted in Hashem's Chochmah. Souls differ in their level and in the "garment" through which they come down, but the root is the same. Chassidus sees every Jew this way, which is the basis of Chabad ahavas Yisrael and of mivtzoyim. The man on the street you offer tefillin to has a soul that is literally part of G-d.</p>
<p><b>Connecting to tzaddikim.</b> The chapter also explains that simpler souls receive life through their connection to the souls of great Torah scholars and tzaddikim, their "head". That's one source of the Chassidic idea of connection to a Rebbe.</p>`,

      { id: "m8-2-q2", t: "mc", q: "Why does the Alter Rebbe add the word \"mamash\"?", o: ["To show it's literal, not a metaphor", "For rhythm", "It's in the verse", "To mean \"very\""], a: 0, x: "The soul's essence is truly G-dly." },
      { id: "m8-2-q3", t: "mc", q: "The analogy in ch. 2 is:", o: ["A child drawn from the father's mind", "A candle from a flame", "A king and servant", "Water from a spring"], a: 0, x: "Separate, yet rooted in the source." },

  {
    id: "m8-3", title: "Tanya ch. 3 to 5: the soul's powers and garments", minutes: 5, intro: false,
    teach: `
<p><b>Ch. 3: ten powers.</b> Each soul has ten powers, like the ten sefiros:</p>
<ul>
<li><b>Three intellectual:</b> Chochmah, Binah, Daas.</li>
<li><b>Seven emotional:</b> love (Chesed), fear (Gevurah), compassion (Tiferes), and the rest.</li>
</ul>
<p>Love and fear of Hashem are "born" from the intellect: contemplating Hashem's greatness produces them, and Daas holds the contemplation firmly enough to generate real emotion. (Module 1 covered this.)</p>
<p><b>Ch. 4: three garments.</b> The soul expresses itself through three "garments":</p>
<ul>
<li><b>Thought:</b> thinking and learning Torah.</li>
<li><b>Speech:</b> speaking Torah and davening.</li>
<li><b>Action:</b> doing mitzvos.</li>
</ul>
<p>When these garments are "dressed" in Torah and mitzvos, which are Hashem's will and wisdom, the soul is united with Hashem. The Alter Rebbe's analogy: embracing a king, even through his clothing, is embracing the king.</p>
<p><b>Ch. 5: the wondrous union.</b> When you understand a halacha, your mind grasps it and is also encompassed by it. Since the halacha is Hashem's wisdom, knowing it creates a unique unity: "a wondrous union, like none other". This is why Torah study is so central.</p>
<p><b>For you.</b> Learning a Rambam or a halacha about brachos is literally a union with Hashem's wisdom, not "just information".</p>`,

  {
    id: "m8-4", title: "Tanya ch. 6 to 8: kelipah and the animal soul", minutes: 5, intro: false,
    teach: `
<p><b>Ch. 6: the other side.</b> Just as holiness has ten powers and three garments, so does the "other side", the <i>sitra achra</i>, or <i>kelipah</i> ("shell"). Kelipah is anything that feels itself as separate from Hashem. It's called a shell because it conceals the G-dly energy inside.</p>
<p><b>Two kinds of kelipah.</b></p>
<ul>
<li><b>The three completely impure kelipos:</b> the source of forbidden things. They can't be elevated directly.</li>
<li><b>Kelipas noga:</b> the "glowing shell". It's neutral, the source of permitted things, and of the animal soul of a Jew.</li>
</ul>
<p><b>Ch. 7: elevating the permitted.</b> When you eat permitted food (kelipas noga) with the intention of serving Hashem, with the energy used for Torah, davening, or mitzvos, that energy is elevated to holiness. If you eat for pure indulgence, it stays in noga, and becomes a "dirt" that needs cleansing (until teshuvah). The same food, two outcomes, depending on why you eat.</p>
<p><b>Ch. 8: forbidden things.</b> Forbidden foods are called <i>asurim</i>, "bound", because the energy in them is bound and can't be elevated through eating them. That's why aveiros damage the soul more deeply.</p>
<p><b>For you.</b> The gym, eating clean, sleeping well, and running a business are all kelipas noga. Done for their own sake, they stay neutral. Done so you have strength, clarity, and resources to serve Hashem, they're elevated. Same squat, different spiritual result.</p>`,

    id: "m8-5", title: "Tanya ch. 9: the battle for the body", minutes: 5, intro: false,
    teach: `
<p><b>Where each soul "lives".</b></p>
<ul>
<li><b>The animal soul:</b> in the left chamber of the heart, which is full of blood. It's the seat of natural desire.</li>
<li><b>The G-dly soul:</b> primarily in the brain, spreading to the right chamber of the heart, the seat of holy love and fear.</li>
</ul>
<p>Tanya uses the heart's anatomy as a map of the inner life.</p>
<p><b>A small city.</b> The Alter Rebbe cites Koheles 9:14: "a small city... and a great king came upon it". The body is the small city. Two kings, the G-dly soul and the animal soul, each want to rule it. Each wants its thoughts, speech, and actions to fill the body. Every moment, the question is who's in charge.</p>
<p><b>What each soul wants.</b></p>
<ul>
<li><b>The G-dly soul</b> wants to rule alone, so that the three garments are only for Hashem.</li>
<li><b>The animal soul</b> wants the opposite: that the body be driven by its desires.</li>
</ul>
<p><b>Why this matters.</b> Tanya reframes inner conflict. Feeling pulled in two directions isn't a sign that something's wrong with you. It's the normal situation of every Jew. What matters is who wins in action, speech, and thought.</p>
<p><b>For you.</b> The pull to check your phone during seder, or to skip Mincha for a customer, isn't weakness in you. It's the battle. You don't need to win every feeling. You need to win the decision.</p>`,

    id: "m8-6", title: "Tanya ch. 10: the tzaddik", minutes: 5, intro: false,
    teach: `
<p><b>The definition.</b> A tzaddik is someone whose G-dly soul has won so completely that the evil in his animal soul has been transformed into good or expelled. He doesn't just control his desires. He doesn't have the negative desires anymore.</p>
<p><b>Two levels.</b></p>
<ul>
<li><b>Tzaddik gamur</b> (a complete tzaddik, "tzaddik v'tov lo"): all the evil has been transformed into good. He loves Hashem with an intense love that leaves no room for anything else.</li>
<li><b>Tzaddik she'eino gamur</b> (an incomplete tzaddik, "tzaddik v'ra lo"): a small trace of evil remains, nullified within the good, but not fully gone.</li>
</ul>
<p><b>Rare.</b> Tanya says complete tzaddikim are few. The Gemara says they are "few" (Sukkah 45b). The level isn't attainable by choice alone. It's partly a gift from Above.</p>
<p><b>Why this matters for you.</b> If being a tzaddik means having no inner struggle, then you're not one, and you're not supposed to be yet. That's freeing. Struggle isn't failure. It means you're in the category Tanya was written for.</p>
<p><b>Is'hapcha.</b> The tzaddik's avodah is transformation: turning darkness into light. That's lesson m8-12.</p>`,

    id: "m8-7", title: "Tanya ch. 11: the rasha", minutes: 5, intro: false,
    teach: `
<p><b>The definition.</b> In Tanya's terms, a rasha is someone in whom the animal soul sometimes wins in action, speech, or thought: he actually sins.</p>
<p><b>Two levels.</b></p>
<ul>
<li><b>Rasha v'tov lo</b> ("a rasha who has good"): he sins, but the G-dly soul still has a voice. He feels regret, wants to do teshuvah, and may do a lot of good. Sometimes the evil wins, sometimes the good. <b>This is what you described in the interview as a beinoni.</b> Tanya calls it a type of rasha.</li>
<li><b>Rasha v'ra lo</b> ("a rasha who has evil"): the evil has taken over so fully that he has no regret, and the G-dly soul has almost no voice.</li>
</ul>
<p><b>Don't panic.</b> "Rasha" in Tanya is a technical category, not an insult or a verdict on your worth. The oath of chapter 1 says: consider yourself a rasha. Tanya's point is that most people, most of the time, move between these levels. The G-dly soul is never gone. It's "a part of G-d above", and teshuvah is always possible. Teshuvah immediately changes a person's status (Rambam, Hilchos Teshuvah 7).</p>
<p><b>The practical message.</b> One sin doesn't define you, but it matters. The goal is to stop the actual sinning in thought, speech, and action. That's the beinoni, chapter 12.</p>`,

    id: "m8-8", title: "Tanya ch. 12: the beinoni", minutes: 5, intro: false,
    teach: `
<p><b>The definition.</b> A beinoni <b>never sins</b>: not in action, not in speech, and not in thought (meaning he never deliberately dwells on forbidden thoughts). He never has, and never will. Yet the evil in his animal soul is still fully alive. It still desires. He just never lets it act.</p>
<p><b>How.</b> The mind rules the heart by its nature: "moach shalit al halev". The beinoni's G-dly soul uses this at every moment. When a forbidden thought arises, he pushes it away immediately. He doesn't entertain it. The thought arising isn't a sin. Dwelling on it would be.</p>
<p><b>Ch. 13 and 14.</b> The beinoni is judged by both inclinations: his heart still has desires, but his actions are all governed by the good. Crucially, ch. 14 says: <b>the level of beinoni is attainable by every person, at every moment.</b> You can't choose to be a tzaddik, but you can choose to be a beinoni right now, in this hour.</p>
<p><b>Why Rabbah called himself a beinoni.</b> He didn't sin, but he still felt the pull. That's the beinoni.</p>
<p><b>For you.</b> The goal isn't to stop feeling the pull of the phone, of anger at a customer, or of lashon hara. The goal is that the pull never becomes a decision. Hour by hour. That's a realistic, daily avodah, and exactly what Tanya was written for.</p>`,

    id: "m8-9", title: "Bittul", minutes: 5, intro: false,
    teach: `
<p><b>What it is.</b> <i>Bittul</i> is self-nullification. It isn't low self-esteem. It's the recognition that your existence, talents, and success come from Hashem and exist for Him.</p>
<p><b>Two levels.</b></p>
<ul>
<li><b>Bittul hayesh:</b> nullifying the ego. You still feel you exist, but you don't put yourself at the center, and you submit your will to Hashem's.</li>
<li><b>Bittul b'metzius:</b> total self-nullification. Feeling that, before Hashem, you don't exist as a separate thing at all.</li>
</ul>
<p><b>Why it matters.</b> Chassidus teaches that Hashem's presence can rest only where there's bittul. The Gemara says of the arrogant person, "I and he cannot dwell together" (Sotah 5a). Humility makes room for Hashem.</p>
<p><b>Moshe.</b> The Torah calls Moshe the humblest man (Bamidbar 12:3), yet he was the greatest leader. He knew his greatness, and knew it was a gift. Chassidus explains that true humility isn't denying your strengths. It's knowing that they're given to you, and that if someone else had them, he might use them better.</p>
<p><b>For you.</b> You co-own a business, you train hard, you're smart. Bittul doesn't mean downplaying any of that. It means holding it as a trust: success isn't your own achievement alone, and it exists for a purpose beyond you.</p>`,

  {
    id: "m8-10", title: "Dirah b'tachtonim", minutes: 5, intro: false,
    teach: `
<p><b>Why did Hashem create the world?</b> The Midrash (Tanchuma, Naso 16) answers: "Hashem desired a dwelling place in the lower realms" (<i>dirah b'tachtonim</i>). Tanya ch. 36 builds on this. The purpose isn't the high spiritual worlds, where G-dliness is obvious. It's this physical world, the lowest, where G-dliness is most hidden. Hashem wants to be at home precisely here.</p>
<p><b>What "home" means.</b> In your own home, you're fully yourself: no masks, no formality. Making the world a home for Hashem means making the physical world a place where His essence is revealed. That happens through Torah and mitzvos done with physical things: tefillin of leather, tzedakah with money, Shabbos with food.</p>
<p><b>Why the lowest.</b> The lower the place, the greater the "light from darkness" when it's transformed. That's why Chassidus doesn't escape the world. It engages it.</p>
<p><b>Your life.</b></p>
<ul>
<li><b>The business:</b> honesty, Shabbos, maaser.</li>
<li><b>The gym:</b> strength for avodah.</li>
<li><b>Friendships:</b> ahavas Yisrael.</li>
<li><b>Future home:</b> a mikdash me'at.</li>
</ul>
<p>These are all the "lower realms". They aren't distractions from the purpose. They <i>are</i> the purpose, when done right.</p>
<p><b>Moshiach</b> is the completion: when the whole world is openly Hashem's home.</p>`,

    id: "m8-11", title: "Hashgacha pratis", minutes: 5, intro: false,
    teach: `
<p><b>The Baal Shem Tov's teaching.</b> Hashem's providence extends to every detail of creation. Not only people, but every leaf turning in the wind and every blade of grass is directed by Hashem for a purpose within the whole of creation. This is <i>hashgacha pratis</i>, individual providence.</p>
<p><b>The Rambam's view.</b> The Rambam (Moreh Nevuchim 3:17 to 18) held that individual providence applies to human beings, while other species are governed at the level of the species. The Baal Shem Tov's broader view is the Chassidic position, and Chabad follows it.</p>
<p><b>The consequence.</b> If everything is directed, then everything you see or hear has a message for you. The Baal Shem Tov taught that a person should learn a lesson in serving Hashem from everything he sees or hears. The Rebbe constantly drew lessons from events: news, technology, anything.</p>
<p><b>Practical.</b></p>
<ul>
<li><b>A lost customer, a delay, a random conversation:</b> not random. Ask what the lesson is, without becoming anxious or superstitious.</li>
<li><b>Meeting someone "by chance":</b> maybe you're meant to help him.</li>
<li><b>Hardship:</b> hashgacha pratis doesn't mean you'll understand why. It means it isn't meaningless.</li>
</ul>
<p><b>Balance.</b> It doesn't replace effort. Hashgacha pratis works through your hishtadlus, not instead of it.</p>`,
